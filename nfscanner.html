<style>
:root{
  --bg-page:#F5F7FA; --bg-card:#fff; --bg-stripe:#f8f9fa; --bg-hover:#f0f4ff;
  --text-1:#202124; --text-2:#5F6368; --border-c:#E0E0E0; --border-strong:#C4C7CC;
  --th-bg:#f0f4ff;
}
[data-theme="dark"]{
  --bg-page:#14171F; --bg-card:#1E222C; --bg-stripe:#242835; --bg-hover:#232A3D;
  --text-1:#E8E9ED; --text-2:#9AA0AC; --border-c:#2E3340; --border-strong:#3C4252;
  --th-bg:#1B2438;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;display:flex;height:100vh;overflow:hidden;background:var(--bg-page);color:var(--text-1);transition:background .2s,color .2s}
.sync-dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.sync-ok{background:#34A853}
.sync-syncing{background:#FBBC04;animation:pulse 1s infinite}
.sync-err{background:#EA4335}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.theme-btn{background:none;border:1px solid var(--border-c);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--text-1)}
.theme-btn:hover{background:var(--bg-stripe)}
#sidebar{width:236px;min-width:236px;background:#1C2B4A;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
#sidebar h1{color:#fff;font-size:19px;font-weight:700;padding:20px 16px 5px}
#sidebar p{color:rgba(255,255,255,.4);font-size:11px;padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.1)}
.ng{padding:10px 16px 3px;color:rgba(255,255,255,.35);font-size:10.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.nb{display:block;width:100%;padding:11px 16px;background:none;border:none;color:rgba(255,255,255,.8);font:inherit;font-size:14px;cursor:pointer;text-align:left;position:relative}
.nb:hover{background:#2D3F5E;color:#fff}
.nb.on{background:#1A73E8;color:#fff;font-weight:600}
.sep{height:1px;background:rgba(255,255,255,.08);margin:4px 12px}
.badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#EA4335;color:#fff;font-size:10px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#bar{background:var(--bg-card);border-bottom:1px solid var(--border-c);height:50px;display:flex;align-items:center;padding:0 22px;justify-content:space-between}
#bar h2{font-size:15px;font-weight:600}
#acts{display:flex;gap:8px}
#page{flex:1;overflow-y:auto;padding:20px 22px}
.spin{width:32px;height:32px;border:3px solid var(--border-c);border-top-color:#1A73E8;border-radius:50%;animation:sp .7s linear infinite;margin:60px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--bg-card);border-radius:12px;padding:16px 18px;box-shadow:0 1px 8px rgba(0,0,0,.07);display:flex;flex-direction:column;gap:6px;position:relative}
.kpi-info{position:absolute;top:14px;right:14px;width:20px;height:20px;border-radius:50%;background:var(--bg-stripe);color:var(--text-2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none}
.kpi-info:hover{background:var(--border-c)}
.kpi-what{font-size:calc(11px * var(--fs,1));color:#1A73E8;font-weight:600;cursor:pointer;text-decoration:none;margin-top:2px;display:inline-block}
.kpi-what:hover{text-decoration:underline}
.meta-ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:2px auto 4px;position:relative}
.meta-ring-inner{width:62px;height:62px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(15px * var(--fs,1));color:var(--text-1)}
.ana-layout{display:grid;grid-template-columns:1fr 260px;gap:14px;margin-bottom:14px;align-items:start}
.ana-kpis{grid-column:1;grid-row:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ana-chart-cell{grid-column:1;grid-row:2}
.ana-meta-cell{grid-column:2;grid-row:1 / span 2;background:var(--bg-card);border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.07);padding:22px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;height:100%}
.meta-ring-lg{width:132px;height:132px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:10px auto}
.meta-ring-lg-inner{width:98px;height:98px;border-radius:50%;background:var(--bg-card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(23px * var(--fs,1));color:var(--text-1)}
.bell-btn{background:var(--bg-stripe);border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.bell-btn:hover{background:var(--border-c)}
.backup-toast{position:fixed;bottom:20px;right:20px;background:var(--bg-card);border:1px solid var(--border-c);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:16px 18px;max-width:300px;z-index:5000;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.exp-ctrl{position:absolute;bottom:8px;right:8px;width:26px;height:22px;border-radius:6px;background:var(--bg-stripe);color:var(--text-2);border:none;font-size:11px;font-weight:800;cursor:pointer;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;z-index:6;title:'Expandir card'}
[data-fsid]:hover .exp-ctrl{opacity:1}
.exp-ctrl:hover{background:var(--border-c)}
.kpi-top{display:flex;align-items:center;gap:9px;margin-bottom:2px}
.kpi-ic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-ic svg{width:16px;height:16px}
.kpi-ic.ic-b{background:#EAF2FF;color:#1A73E8}
.kpi-ic.ic-g{background:#E6F4EA;color:#34A853}
.kpi-ic.ic-r{background:#FCE8E6;color:#EA4335}
.kpi .l{font-size:calc(10px * var(--fs,1));color:var(--text-2);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.kpi .l2{font-size:calc(13px * var(--fs,1));color:var(--text-2);font-weight:500}
.kpi .v{font-size:calc(22px * var(--fs,1));font-weight:700}
.kpi .v2{font-size:calc(24px * var(--fs,1));font-weight:700;line-height:1.2}
.kpi .s{font-size:calc(11px * var(--fs,1));color:var(--text-2);margin-top:3px}
.kpi .trend{display:flex;align-items:center;gap:3px;font-size:calc(13px * var(--fs,1));font-weight:700}

<script>
// ══════════════════════════════════════════════════════════════════
// CAMADA DE DADOS — Google Drive (JSON único) + localStorage
// Mesmo padrão usado no "Dívidas Nunca Mais"
// ══════════════════════════════════════════════════════════════════
var GDRIVE_CLIENT_ID = '956166140778-6mut3h6srbmer60tbrg73vspd8a47j0g.apps.googleusercontent.com';
var GDRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
var GDRIVE_FILENAME = 'nfscanner-data.json';
var LS_KEY = 'nfscanner_db_cache';
var LS_FILEID_KEY = 'nfscanner_drive_file_id';

var DB = {notas_fiscais:[],itens:[],estabelecimentos:[],estoque:[],devolucoes:[],marcas:[],lista_compras:[],configuracoes:[],_migr:{},_seq:{}};
var CORES=['#1A73E8','#34A853','#FBBC04','#EA4335','#9C27B0','#FF6F00'];
document.addEventListener('DOMContentLoaded', function(){
  if(typeof Chart !== 'undefined'){
    Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    Chart.defaults.font.size = 14;
  }
});
var DB_ACCESS_TOKEN = null;
var DB_FILE_ID = localStorage.getItem(LS_FILEID_KEY) || null;
var DB_TOKEN_CLIENT = null;
var DB_SAVE_TIMER = null;
var DB_READY = false;
var DB_READY_CBS = [];

function nextId(table){
  DB._seq[table] = (DB._seq[table]||0) + 1;
  return DB._seq[table];
}
function recalcSeq(){
  ['notas_fiscais','itens','estabelecimentos','estoque','devolucoes','marcas','lista_compras','produtos','configuracoes','alertas_preco'].forEach(function(t){
    var max=0; (DB[t]||[]).forEach(function(r){ if(r.id>max)max=r.id; });
    DB._seq[t]=max;
  });
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DB)); }catch(e){} }
function loadLocal(){ try{ var raw=localStorage.getItem(LS_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; } }

function scheduleDriveSave(){
  saveLocal();
  if(DB_SAVE_TIMER) clearTimeout(DB_SAVE_TIMER);
  DB_SAVE_TIMER = setTimeout(saveToDrive, 1500);
}

async function driveFetch(url, opts){
  opts = opts||{};
  opts.headers = opts.headers||{};
  opts.headers['Authorization'] = 'Bearer '+DB_ACCESS_TOKEN;
  return fetch(url, opts);
}

function refreshAccessTokenSilently(){
  return new Promise(function(resolve){
    try{
      var original = DB_TOKEN_CLIENT.callback;
      DB_TOKEN_CLIENT.callback = function(resp){
        DB_TOKEN_CLIENT.callback = original;
        if(resp && resp.access_token){ DB_ACCESS_TOKEN = resp.access_token; resolve(true); }
        else resolve(false);
      };
      DB_TOKEN_CLIENT.requestAccessToken({prompt:''});
    }catch(e){ resolve(false); }
  });
}
async function driveFetchChecked(url, opts){
  var r = await driveFetch(url, opts);
  if(r.status===401){
    var ok = await refreshAccessTokenSilently();
    if(ok){ r = await driveFetch(url, opts); }
  }
  if(!r.ok){
    var txt=''; try{ txt = await r.text(); }catch(e){}
    throw new Error('Drive API erro '+r.status+': '+txt.substring(0,200));
  }
  return r;
}
async function findOrCreateDriveFile(){
  var q = encodeURIComponent("name='"+GDRIVE_FILENAME+"' and trashed=false");
  var r = await driveFetchChecked('https://www.googleapis.com/drive/v3/files?q='+q+'&spaces=drive&fields=files(id,name,createdTime)&orderBy=createdTime');
  var j = await r.json();
  if(j.files && j.files.length){
    if(j.files.length>1) console.warn('Atenção: existem '+j.files.length+' arquivos "'+GDRIVE_FILENAME+'" no Drive. Usando o mais antigo.');
    DB_FILE_ID = j.files[0].id;
    localStorage.setItem(LS_FILEID_KEY, DB_FILE_ID);
    return DB_FILE_ID;
  }
  // Cria arquivo novo (só chega aqui se realmente não existir nenhum)
  var metadata = {name:GDRIVE_FILENAME, mimeType:'application/json'};
  var boundary='nfscbound'; var delim="\r\n--"+boundary+"\r\n"; var close="\r\n--"+boundary+"--";
  var body = delim+'Content-Type: application/json\r\n\r\n'+JSON.stringify(metadata)+
    delim+'Content-Type: application/json\r\n\r\n'+JSON.stringify(DB)+close;
  var r2 = await driveFetchChecked('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
    method:'POST', headers:{'Content-Type':'multipart/related; boundary='+boundary}, body:body
  });
  var j2 = await r2.json();
  DB_FILE_ID = j2.id;
  localStorage.setItem(LS_FILEID_KEY, DB_FILE_ID);
  return DB_FILE_ID;
}

async function loadFromDrive(){
  await findOrCreateDriveFile();
  var r = await driveFetchChecked('https://www.googleapis.com/drive/v3/files/'+DB_FILE_ID+'?alt=media');
  var txt = await r.text();
  if(txt && txt.trim()){
    var parsed = JSON.parse(txt);
    Object.keys(DB).forEach(function(k){ if(parsed[k]!==undefined) DB[k]=parsed[k]; });
  }
  recalcSeq();
  saveLocal();
}

async function saveToDrive(){
  if(!DB_ACCESS_TOKEN) return;
  try{
    if(!DB_FILE_ID) await findOrCreateDriveFile();
    await driveFetchChecked('https://www.googleapis.com/upload/drive/v3/files/'+DB_FILE_ID+'?uploadType=media',{
      method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(DB)
    });
    setSyncStatus('ok');
  }catch(e){ console.error('Falha ao salvar no Drive:', e); setSyncStatus('err'); }
}
function setSyncStatus(s){
  var el=document.getElementById('sync-st'); if(!el)return;
  el.className='sync-dot sync-'+s;
  el.title = s==='ok'?'Sincronizado com o Google Drive':(s==='syncing'?'Sincronizando...':'Falha ao sincronizar');
  if(s==='err') mostrarErroSync();
  else fecharErroSync();
}
function mostrarErroSync(){
  if(document.getElementById('sync-toast')) return;
  var div=document.createElement('div');
  div.id='sync-toast'; div.className='backup-toast';

function migrarCategoriasV1(){
  DB._migr = DB._migr || {};
  if(DB._migr.cat_v1) return null;
  var SEM_CAT=['','Utensílios','Outro',null,undefined];
  var nfs={}, mudNotas=0, mudItens=0, mudEst=0, mudProd=0;
  (DB.notas_fiscais||[]).forEach(function(n){
    var novo=classificarLoja(n.estabelecimento, n.cnpj);
    if(n.tipo_loja!==novo){ n.tipo_loja=novo; mudNotas++; }
    nfs[n.id]=novo;
  });
  (DB.estabelecimentos||[]).forEach(function(e){
    if(e.categoria==='Outro'||!e.categoria){
      var novo=classificarLoja(e.razao_social||e.nome_fantasia, e.cnpj);
      if(novo!=='Outro'){ e.categoria=novo; mudEst++; }
    }
  });
  var tiposNaoAlimento=['Posto','Construção','Móveis','Vestuário','Loja de departamento','Automotivo','Alimentação','Outro'];
  (DB.itens||[]).forEach(function(it){
    var tipo=nfs[it.nota_id]; if(!tipo) return;
    var antes=it.categoria, nova=antes;
    if(LOJAS_ALIMENTO.indexOf(tipo)>=0){
      if(SEM_CAT.indexOf(antes)>=0 || tiposNaoAlimento.indexOf(antes)>=0){ var c=gCat(it.descricao); if(c!=='Utensílios' || SEM_CAT.indexOf(antes)>=0) nova=c; }
      else if(antes==='Pães e Panificados' && /bisc|negresco|oreo|cracker|bolacha/i.test(it.descricao)) nova='Snacks e Biscoitos';
    } else if(SEM_CAT.indexOf(antes)>=0 || tiposNaoAlimento.indexOf(antes)>=0){ nova=tipo; }
    if(nova!==antes){ it.categoria=nova; it.local=gLocal(nova); mudItens++; }
  });
  (DB.produtos||[]).forEach(function(p){
    if(SEM_CAT.indexOf(p.categoria)>=0){ var c=gCat(p.nome); if(c!=='Utensílios'){ p.categoria=c; mudProd++; } }
  });
  DB._migr.cat_v1=Date.now();
  return {notas:mudNotas, itens:mudItens, estabelecimentos:mudEst, produtos:mudProd};
}

// ── Emulação da API do Supabase sobre o DB local (mesma sintaxe usada no restante do app) ──
function sb_query(table){
  var st={table:table,op:null,payload:null,filters:[],ord:null,wantSingle:false,wantMaybe:false,upsertOpts:null,selectAfter:false};
  function rowsOf(){ return Array.isArray(DB[table]) ? DB[table] : (DB[table]=[]); }
  function matches(row){
    return st.filters.every(function(f){
      if(f.type==='in') return f.vals.indexOf(row[f.col])!==-1;
      return row[f.col]===f.val;
    });
  }
  function exec(){
    var rows=rowsOf();
    if(st.op==='select'||st.op===null){
      var res=rows.filter(matches);
      if(st.ord) res=res.slice().sort(function(a,b){ var av=a[st.ord.col],bv=b[st.ord.col]; if(av<bv)return st.ord.ascending?-1:1; if(av>bv)return st.ord.ascending?1:-1; return 0; });
      if(st.wantMaybe) return {data: res.length?res[0]:null, error:null};
      if(st.wantSingle) return {data: res.length?res[0]:null, error: res.length?null:{message:'not found'}};
      return {data:res, error:null};
    }
    if(st.op==='insert'){
      var arr = Array.isArray(st.payload)?st.payload:[st.payload];
      var inserted=[];
      arr.forEach(function(row){
        var r=Object.assign({}, row);
        if(r.id===undefined||r.id===null) r.id=nextId(table);
        rows.push(r); inserted.push(r);
      });
      scheduleDriveSave();
      if(st.selectAfter){
        if(st.wantSingle) return {data:inserted[0], error:null};
        return {data:inserted, error:null};
      }
      return {data:null, error:null};
    }
    if(st.op==='update'){
      rows.forEach(function(row){ if(matches(row)) Object.assign(row, st.payload); });
      scheduleDriveSave();
      return {data:null, error:null};
    }
    if(st.op==='delete'){
      var kept=rows.filter(function(r){ return !matches(r); });
      DB[table]=kept;
      scheduleDriveSave();
      return {data:null, error:null};
    }
    if(st.op==='upsert'){
      var conflictCol = (st.upsertOpts&&st.upsertOpts.onConflict)||'id';
      var ignoreDup = st.upsertOpts&&st.upsertOpts.ignoreDuplicates;
      var arr2 = Array.isArray(st.payload)?st.payload:[st.payload];
      arr2.forEach(function(row){
        var existing=rows.find(function(r){ return r[conflictCol]===row[conflictCol]; });
        if(existing){
          if(!ignoreDup) Object.assign(existing,row);
        } else {
          var r=Object.assign({},row);
          if(r.id===undefined||r.id===null) r.id=nextId(table);
          rows.push(r);
        }
      });
      scheduleDriveSave();
      return {data:null, error:null};
    }
    return {data:null, error:{message:'op desconhecida'}};
  }
  var thenable = {
    select:function(cols){ if(st.op===null) st.op='select'; else st.selectAfter=true; return thenable; },
    insert:function(payload){ st.op='insert'; st.payload=payload; return thenable; },
    update:function(payload){ st.op='update'; st.payload=payload; return thenable; },
    delete:function(){ st.op='delete'; return thenable; },
    upsert:function(payload,opts){ st.op='upsert'; st.payload=payload; st.upsertOpts=opts; return thenable; },
    eq:function(col,val){ st.filters.push({col:col,val:val}); return thenable; },
    in:function(col,vals){ st.filters.push({col:col,vals:vals,type:'in'}); return thenable; },
    order:function(col,opts){ st.ord={col:col,ascending:opts?opts.ascending!==false:true}; return thenable; },
    maybeSingle:function(){ st.wantMaybe=true; return thenable; },
    single:function(){ st.wantSingle=true; return thenable; },
    then:function(resolve,reject){
      var run=function(){ try{ resolve(exec()); }catch(e){ reject?reject(e):resolve({data:null,error:{message:e.message}}); } };
      if(DB_READY) run(); else whenDbReady(run);
    }
  };
  return thenable;
}

// ── Criação de gráficos com suporte a reescala de fonte ────────────────
// Chart.js v4 envolve as opções num Proxy interno; mutar isso ao vivo
// pode travar (erro de recursão). Por isso, ao mudar o tamanho da fonte,
// destruímos e recriamos o gráfico do zero com a config original + fonte nova.
function criarGraficoComFonte(canvasEl, cfg){
  var base = {scales:{}, legend:null};
  try{
    if(cfg.options && cfg.options.scales){
      Object.keys(cfg.options.scales).forEach(function(k){
        var ax = cfg.options.scales[k];
        base.scales[k] = (ax.ticks && ax.ticks.font && ax.ticks.font.size) || 14;
      });
    }
    if(cfg.options && cfg.options.plugins && cfg.options.plugins.legend && cfg.options.plugins.legend.labels && cfg.options.plugins.legend.labels.font){
      base.legend = cfg.options.plugins.legend.labels.font.size || 14;
    }
  }catch(e){}

  if(!cfg.options) cfg.options = {};
  // v25: padroniza fontes (12.5px, igual ao "Top Marcas"), sem rotação e nítido em qualquer tela
  var FS = 12.5;
  try{
    var sc0 = cfg.options.scales || {};
    Object.keys(sc0).forEach(function(k){
      var ax = sc0[k]; ax.ticks = ax.ticks || {};
      ax.ticks.font = Object.assign({}, ax.ticks.font||{}, {size:FS});
      if(ax.ticks.maxRotation === undefined) ax.ticks.maxRotation = 0;
      if(ax.ticks.minRotation === undefined) ax.ticks.minRotation = 0;
      if(ax.ticks.autoSkip === undefined) ax.ticks.autoSkip = true;
      if(ax.ticks.autoSkipPadding === undefined) ax.ticks.autoSkipPadding = 10;
      base.scales[k] = FS;
    });
    var pl = cfg.options.plugins = cfg.options.plugins || {};
    if(pl.legend && pl.legend.display !== false){
      pl.legend.labels = pl.legend.labels || {};
      pl.legend.labels.font = Object.assign({}, pl.legend.labels.font||{}, {size:FS});
      pl.legend.labels.boxWidth = pl.legend.labels.boxWidth || 12;
      base.legend = FS;
    }
    pl.tooltip = Object.assign({titleFont:{size:FS},bodyFont:{size:FS}}, pl.tooltip||{});
  }catch(e){}
  cfg.options.devicePixelRatio = Math.max(2, window.devicePixelRatio || 1);

  canvasEl.__chartConfig = cfg;
  canvasEl.__baseFonts = base;
  return new Chart(canvasEl.getContext('2d'), cfg);
}
function reescalarGrafico(canvasEl, sc){
  if(!canvasEl || !canvasEl.__chartConfig || typeof Chart==='undefined') return;
  var cfg = canvasEl.__chartConfig;
  var base = canvasEl.__baseFonts || {scales:{},legend:null};
  try{ var old = Chart.getChart(canvasEl); if(old) old.destroy(); }catch(e){}
  try{
    if(cfg.options && cfg.options.scales){
      Object.keys(cfg.options.scales).forEach(function(k){
        var ax = cfg.options.scales[k];
        if(!ax.ticks) ax.ticks={};
        if(!ax.ticks.font) ax.ticks.font={};
        ax.ticks.font.size = Math.round((base.scales[k]||11)*sc);
      });
    }
    if(base.legend && cfg.options && cfg.options.plugins && cfg.options.plugins.legend && cfg.options.plugins.legend.labels){
      cfg.options.plugins.legend.labels.font = cfg.options.plugins.legend.labels.font||{};
      cfg.options.plugins.legend.labels.font.size = Math.round(base.legend*sc);
    }
    new Chart(canvasEl.getContext('2d'), cfg);
  }catch(e){ console.warn('Falha ao reescalar gráfico:', e); }
}

var _npReq = 0;
function npPedir(type, extra, timeoutMs){
  return new Promise(function(resolve){
    var id = ++_npReq, done=false;
    function on(ev){
      if(ev.source!==window || !ev.data || ev.data.source!=='nfs-extension' || ev.data.reqId!==id) return;
      done=true; window.removeEventListener('message', on); resolve(ev.data);
    }
    window.addEventListener('message', on);
    window.postMessage(Object.assign({source:'nfscanner-app', type:type, reqId:id}, extra||{}), '*');
    setTimeout(function(){ if(!done){ window.removeEventListener('message', on); resolve(null); } }, timeoutMs||1500);
  });
}

async function npImportarNota(n){

  if(!d.cnpj) d.cnpj=n.cnpj;
  if(!d.estabelecimento||d.estabelecimento==='Não identificado') d.estabelecimento=n.estabelecimento;
  if(!d.valorTotal) d.valorTotal=n.valor;
  d.formaPagamento=d.formaPagamento||'Não informado';
  var chave=d.chave||('NP'+n.id);
  var r=await sb.from('notas_fiscais').select('id').eq('chave_acesso', chave).maybeSingle();
  if(r.data) return 'dup';
  var tipo=classificarLoja(d.estabelecimento, d.cnpj);

    chave_acesso:chave, data_emissao:d.dataEmissao, hora_emissao:d.hora||'', estabelecimento:d.estabelecimento, cnpj:d.cnpj,
    valor_total:d.valorTotal, desconto_total:d.descontoTotal, tributos_total:d.tributosImpresso,
    tributos_sefaz:d.tributosSefaz, tributos_impressos:d.tributosImpresso, forma_pagamento:d.formaPagamento,

  }).select().single();
  if(ins.error) throw ins.error;

  d.itens.forEach(function(it){ if(!alimento) it.categoria=tipo; });
  await sb.from('itens').insert(d.itens.map(function(it){ return {nota_id:ins.data.id, descricao:it.descricao, marca:it.marca,
    quantidade:it.quantidade, unidade:it.unidade, valor_unitario:it.valorUnitario, valor_total:it.valorTotal,

  return 'ok';
}
async function npImportar(){
  var btn=g('np-imp'), log=g('np-log'); if(btn) btn.disabled=true;
  var ok=0, dup=0, falhas=[], total=0;
  try{
    while(true){
      var lote=await npPedir('NFS_GET_PENDING',{limit:30},8000);
      if(!lote || !lote.notas || !lote.notas.length) break;
      var ids=[];
      for(var i=0;i<lote.notas.length;i++){
        var n=lote.notas[i]; total++;
        log.innerHTML='<div class="alert ai">⏳ Importando nota '+total+'...</div>';
        try{ var r=await npImportarNota(n); if(r==='dup') dup++; else ok++; ids.push(n.id); }
        catch(e){ falhas.push(n.estabelecimento+' #'+n.numero+': '+(e.message||e)); ids.push(n.id); }
      }
      await npPedir('NFS_MARK_IMPORTED',{ids:ids},8000);
    }
    try{ localStorage.setItem('nfs_last_import', String(Date.now())); }catch(e){}
    scheduleDriveSave();

  }catch(e){ log.innerHTML='<div class="alert ae">Erro: '+esc(e.message||String(e))+'</div>'; }
}

function nfsKpi(ic,lb,val,sub,cor,pq){ return '<div class="kpi"><div class="kpi-top"><div class="kpi-ic '+ic+'">'+ICONS.wallet+'</div><div class="l2">'+lb+'</div></div><div class="v2"'+(cor||pq?' style="'+(cor?'color:'+cor+';':'')+(pq?'font-size:calc(19px * var(--fs,1))':'')+'"':'')+'>'+val+'</div><div class="s">'+sub+'</div></div>'; }
function nfsPad(n){ return (n<10?'0':'')+n; }
function nfsDt(s){
  s=String(s||''); var m=s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(m) return new Date(+m[3],+m[2]-1,+m[1]);
  var i=s.match(/^(\d{4})-(\d{2})-(\d{2})/); return i?new Date(+i[1],+i[2]-1,+i[3]):null;
}
var NFS_MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function nfsSemanaIso(d){
  var t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())), dia=t.getUTCDay()||7;
  t.setUTCDate(t.getUTCDate()+4-dia);
  var y=t.getUTCFullYear(), w=Math.ceil(((t-new Date(Date.UTC(y,0,1)))/86400000+1)/7);
  return [y,w];
}
function nfsInicio(d,g){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(g==='semana'){ var wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); }
  else if(g==='mes') x.setDate(1);
  else if(g==='trimestre'){ x.setDate(1); x.setMonth(Math.floor(x.getMonth()/3)*3); }
  else if(g==='semestre'){ x.setDate(1); x.setMonth(Math.floor(x.getMonth()/6)*6); }
  else if(g==='ano'){ x.setDate(1); x.setMonth(0); }
  return x;
}
function nfsProximo(d,g){
  var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  if(g==='dia') x.setDate(x.getDate()+1);
  else if(g==='semana') x.setDate(x.getDate()+7);
  else if(g==='mes') x.setMonth(x.getMonth()+1);
  else if(g==='trimestre') x.setMonth(x.getMonth()+3);
  else if(g==='semestre') x.setMonth(x.getMonth()+6);
  else x.setFullYear(x.getFullYear()+1);
  return x;
}
function nfsRotulo(d,g,curto){
  var y=d.getFullYear(), m=d.getMonth();
  if(g==='dia') return curto? nfsPad(d.getDate())+'/'+nfsPad(m+1) : nfsPad(d.getDate())+'/'+nfsPad(m+1)+'/'+y;
  if(g==='semana'){ var fim=new Date(d.getFullYear(),d.getMonth(),d.getDate()+6);
    return curto? nfsPad(d.getDate())+'/'+nfsPad(m+1) : nfsPad(d.getDate())+'/'+nfsPad(m+1)+' a '+nfsPad(fim.getDate())+'/'+nfsPad(fim.getMonth()+1)+'/'+fim.getFullYear(); }
  if(g==='mes') return curto? NFS_MES[m]+'/'+String(y).slice(2) : NFS_MES[m]+'/'+y;
  if(g==='trimestre') return (Math.floor(m/3)+1)+'º tri/'+(curto?String(y).slice(2):y);
  if(g==='semestre') return (Math.floor(m/6)+1)+'º sem/'+(curto?String(y).slice(2):y);
  return String(y);
}
function nfsChave(d,g){ return d.getFullYear()+'-'+nfsPad(d.getMonth()+1)+'-'+nfsPad(d.getDate()); }
function nfsSerie(notas,g){
  var map={}, min=null, max=null;
  notas.forEach(function(n){
    var d=nfsDt(n.data_emissao); if(!d) return;
    var ini=nfsInicio(d,g), k=nfsChave(ini);
    if(!map[k]) map[k]={ini:ini,total:0,qtd:0,desc:0};
    map[k].total+=Number(n.valor_total)||0; map[k].qtd++; map[k].desc+=Number(n.desconto_total)||0;
    if(!min||ini<min) min=ini; if(!max||ini>max) max=ini;
  });
  var out=[]; if(!min) return out;
  for(var d=min, guard=0; d<=max && guard<5000; d=nfsProximo(d,g), guard++){
    var k=nfsChave(d), r=map[k]||{ini:d,total:0,qtd:0,desc:0};
    out.push({ini:r.ini,total:r.total,qtd:r.qtd,desc:r.desc,rotulo:nfsRotulo(d,g),curto:nfsRotulo(d,g,true)});
  }
  return out;
}

function nfsRaiz(c){ return String(c||'').replace(/\D/g,'').substring(0,8); }
function nfsNomeRede(notas, estabs){
  var porRaiz={};
  notas.forEach(function(n){ var k=nfsRaiz(n.cnpj)||('x'+n.estabelecimento); var o=porRaiz[k]=porRaiz[k]||{nomes:{},total:0}; o.total+=Number(n.valor_total)||0; var nm=String(n.estabelecimento||'').trim(); o.nomes[nm]=(o.nomes[nm]||0)+(Number(n.valor_total)||0); });
  var fantasia={}; (estabs||[]).forEach(function(e){ if(e.nome_fantasia&&e.nome_fantasia.trim()&&!/^\(/.test(e.nome_fantasia)) { var k=nfsRaiz(e.cnpj); if(!fantasia[k]) fantasia[k]=e.nome_fantasia.trim(); } });
  var nomes={};
  Object.keys(porRaiz).forEach(function(k){
    var best=Object.keys(porRaiz[k].nomes).sort(function(a,b){return porRaiz[k].nomes[b]-porRaiz[k].nomes[a];})[0]||'—';
    nomes[k]=(fantasia[k]||best).replace(/\s+(LTDA|S\/?A|EIRELI|ME|EPP)\.?$/i,'').trim();
  });

function nfsItemKey(desc){

function nfsAgrupaItens(itens, notasPorId){
  var map={};

    var nota=notasPorId[it.nota_id]; if(!nota) return;
    var k=nfsItemKey(it.descricao); if(!k) return;

    var nome=String(it.descricao||'').trim(); o.nomes[nome]=(o.nomes[nome]||0)+1;
    o.cat[it.categoria||'—']=(o.cat[it.categoria||'—']||0)+1;
    if(it.marca) o.marcas[it.marca]=(o.marcas[it.marca]||0)+1;
    o.compras[it.nota_id]=1;
    var q=Number(it.quantidade)||1, vt=Number(it.valor_total)||0, vu=Number(it.valor_unitario)||(q?vt/q:0);
    o.qtd+=q; o.total+=vt;
    o.pontos.push({d:nfsDt(nota.data_emissao),loja:nota.estabelecimento,cnpj:nota.cnpj,q:q,vu:vu,vt:vt,un:it.unidade||''});
  });
  var arr=Object.keys(map).map(function(k){
    var o=map[k], top=function(m){return Object.keys(m).sort(function(a,b){return m[b]-m[a];})[0]||'';};
    var pr=o.pontos.map(function(p){return p.vu;}).filter(function(x){return x>0;});
    var ord=o.pontos.slice().sort(function(a,b){return (a.d||0)-(b.d||0);});
    var minP=pr.length?Math.min.apply(null,pr):0, maxP=pr.length?Math.max.apply(null,pr):0;
    var barato=ord.filter(function(p){return p.vu===minP;})[0];
    return {key:k,nome:top(o.nomes),categoria:top(o.cat),marca:top(o.marcas),vezes:Object.keys(o.compras).length,linhas:o.pontos.length,qtd:o.qtd,total:o.total,
      min:minP,max:maxP,medio:o.qtd?o.total/o.qtd:0,ultimo:ord.length?ord[ord.length-1].vu:0,ultimaData:ord.length?ord[ord.length-1].d:null,
      lojaBarata:barato?barato.loja:'',pontos:ord,unidade:(o.pontos[0]||{}).un||''};
  });

}
function nfsFiltraPeriodo(notas, p){

}

// QUALIDADE DOS DADOS (idempotente: roda a cada abertura, só grava se mudar algo)

function normUnidade(u){
  var s=String(u==null?'':u).trim(); if(!s) return s;
  var k=s.toUpperCase().replace(/[.\s]/g,'');
  if(/^(UN|UND|UNID|UNIDADE|UNI|U)$/.test(k)) return 'Un';
  if(/^(KG|KGS|QUILO|QUILOS|KILO)$/.test(k)) return 'Kg';
  if(/^(L|LT|LTS|LITRO|LITROS)$/.test(k)) return 'L';
  if(/^(PC|PCS|PÇ|PCE|PEC|PEÇ|PECA|PEÇA)$/.test(k)) return 'Pç';
  if(/^(FR|FRASCO)$/.test(k)) return 'Frasco';
  if(/^(PO|POTE)$/.test(k)) return 'Pote';
  if(/^(PT|PCT|PACOTE)$/.test(k)) return 'Pacote';
  if(/^(CX|CAIXA)$/.test(k)) return 'Cx';
  if(/^(SC|SACO)$/.test(k)) return 'Sc';
  return s.charAt(0).toUpperCase()+s.slice(1).toLowerCase();
}
function normCidade(c){
  var s=String(c||'').trim(); if(!s) return s;
  var k=s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
  if(/^maring/.test(k)) return 'Maringá';
  if(k==='sao jose dos pinhais') return 'São José dos Pinhais';
  var small={'de':1,'da':1,'do':1,'dos':1,'das':1,'e':1};
  return s.toLowerCase().split(/\s+/).map(function(w,i){return (i>0&&small[w])?w:w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');
}
function nomeFantasiaDe(razao){
  var s=String(razao||'').replace(/\s+/g,' ').trim();
  s=s.replace(/[\s,.-]+(LTDA|S\/?A|EIRELI|ME|EPP|S\.A\.?|CIA)\.?$/i,'').trim();
  if(s===s.toUpperCase()||s===s.toLowerCase()){
    var small={'de':1,'da':1,'do':1,'dos':1,'das':1,'e':1};
    s=s.toLowerCase().split(' ').map(function(w,i){return (i>0&&small[w])?w:w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');
  }
  return s;
}

function migrarQualidade(){
  var r={unidades:0,cidades:0,fantasia:0,pagamentos:0,tipoLoja:0,itensSemCat:0,descricoes:0,duplicatas:0,estoqueAjustado:0};
  var notas=DB.notas_fiscais||[], itens=DB.itens||[];
  // 1) duplicatas estritas: mesmo CNPJ + data + valor + mesmos itens (ex.: NFC-e e NF-e da mesma compra)
  var porNota={}; itens.forEach(function(i){ (porNota[i.nota_id]=porNota[i.nota_id]||[]).push(i); });
  var assin=function(n){ return (porNota[n.id]||[]).map(function(i){return String(i.descricao||'').toLowerCase().replace(/\s+(preto|branco|110v|220v|bivolt)\b/g,'').replace(/\s+/g,' ').trim()+'|'+Number(i.valor_total).toFixed(2);}).sort().join(';'); };
  var vistos={}, remover={};
  notas.slice().sort(function(a,b){ return (modeloChave(a.chave_acesso)==='65'?0:1)-(modeloChave(b.chave_acesso)==='65'?0:1)||a.id-b.id; }).forEach(function(n){
    if(!n.valor_total||!(porNota[n.id]||[]).length) return;
    var k=[String(n.cnpj||'').replace(/\D/g,''),n.data_emissao,Number(n.valor_total).toFixed(2),assin(n)].join('#');
    if(vistos[k]!==undefined){ remover[n.id]=vistos[k]; } else vistos[k]=n.id;
  });
  var remIds=Object.keys(remover).map(Number);
  if(remIds.length){
    var chaveDe={}; notas.forEach(function(n){chaveDe[n.id]=n.chave_acesso;});
    (DB.estoque||[]).forEach(function(e){ remIds.forEach(function(id){ if(e.nota_chave===chaveDe[id]){ e.nota_chave=chaveDe[remover[id]]; r.estoqueAjustado++; } }); });
    DB.notas_fiscais=notas=notas.filter(function(n){return !remover[n.id];});
    DB.itens=itens=itens.filter(function(i){return !remover[i.nota_id];});
    r.duplicatas=remIds.length;
  }
  // 2) notas: tipo de loja e forma de pagamento
  notas.forEach(function(n){
    if(!n.tipo_loja){ n.tipo_loja=classificarLoja(n.estabelecimento,n.cnpj); r.tipoLoja++; }
    var f=n.forma_pagamento, nf=f;
    if(/^\d+$/.test(String(f||'').trim())) nf='Não informado';
    else { var np=normPagto(f); if(np!=='Outros') nf=np; }
    if(nf!==f){ n.forma_pagamento=nf; r.pagamentos++; }
  });
  // 2b) notas ainda "Outro": reavalia pelo nome e, se preciso, pelo que foi comprado
  var tipoPorItens=function(its){
    var tot=0, por={}; its.forEach(function(i){ var v=Number(i.valor_total)||0; tot+=v; var c=gCat(i.descricao); por[c]=(por[c]||0)+v; });
    var txt=its.map(function(i){return i.descricao;}).join(' ').toLowerCase();
    if(/frango assado|yakisoba|marmit|lanche|pizza|pastel|coxinha|refei/.test(txt)) return 'Alimentação';
    var cnt=function(re){ return its.filter(function(i){return re.test(String(i.descricao||'').toLowerCase());}).length; };
    if((por['Farmácia e Medicamentos']||0)>=tot*0.5 || cnt(/colirio|solucao fisiologica|bepantol|stomaliv|pomada|xarope|comprimid|dipirona|paracetamol|\bsoro\b|vitamina|pastilha|spray nasal/)>=its.length/2) return 'Farmácia';
    if((por['Pets']||0)>=tot*0.5 || cnt(/\bdog\b|\bcat\b|racao|quidog|sache special|petisco|coleira/)>=its.length/2) return 'Petshop';
    if(/vest|rasteira|\btop\b|cotton|calcinha|camis|bermuda|short|sandalia|chinelo/.test(txt)) return 'Vestuário';
    return 'Outro';
  };
  var porNota2={}; itens.forEach(function(i){ (porNota2[i.nota_id]=porNota2[i.nota_id]||[]).push(i); });
  var tipoCnpj={};
  notas.forEach(function(n){
    if(n.tipo_loja!=='Outro') return;
    var t=classificarLoja(n.estabelecimento,n.cnpj);
    if(t==='Outro') t=tipoPorItens(porNota2[n.id]||[]);
    if(t!=='Outro'){ n.tipo_loja=t; r.tipoLoja++; tipoCnpj[String(n.cnpj||'').replace(/\D/g,'')]=t; }
  });
  (DB.estabelecimentos||[]).forEach(function(e){
    var t=tipoCnpj[String(e.cnpj||'').replace(/\D/g,'')];
    if(t && (!e.categoria||e.categoria==='Outro')){ e.categoria=t; r.tipoLoja++; }
  });
  var tipoNota={}; notas.forEach(function(n){tipoNota[n.id]=n.tipo_loja;});
  itens.forEach(function(it){
    var tipo=tipoNota[it.nota_id]; if(!tipoCnpj[String((notas.filter(function(n){return n.id===it.nota_id;})[0]||{}).cnpj||'').replace(/\D/g,'')]) return;
    if(['Outro','Utensílios','',null,undefined].indexOf(it.categoria)>=0){
      var c=LOJAS_ALIMENTO.indexOf(tipo)>=0?gCat(it.descricao):tipo;
      if(c!==it.categoria){ it.categoria=c; it.local=gLocal(c); r.itensSemCat++; }
    }
  });
  // 3) itens: unidade, descrição, categoria ausente
  itens.forEach(function(it){
    var u=normUnidade(it.unidade); if(u!==it.unidade){ it.unidade=u; r.unidades++; }
    var d=String(it.descricao||'').replace(/\s+/g,' ').trim(); if(d!==it.descricao){ it.descricao=d; r.descricoes++; }
    if(!it.categoria){
      var tipo=tipoNota[it.nota_id];
      var c=(tipo&&LOJAS_ALIMENTO.indexOf(tipo)<0&&tipo!=='Outro')?tipo:gCat(it.descricao);
      it.categoria=c; if(!it.local) it.local=gLocal(c); r.itensSemCat++;
    }
  });
  (DB.estoque||[]).forEach(function(e){ var u=normUnidade(e.unidade); if(u!==e.unidade){ e.unidade=u; r.unidades++; } });
  // 3b) nomes e categorias confirmados pelo usuário (aplicados uma única vez por valor)
  DB._migr=DB._migr||{}; var ok=DB._migr.estab_ok=DB._migr.estab_ok||{};
  (DB.estabelecimentos||[]).forEach(function(e){
    var c=ESTAB_CONFIRMADOS[String(e.cnpj||'').replace(/\D/g,'')]; if(!c) return;
    var sig=(c.nome||'')+'|'+(c.categoria||'');
    if(ok[String(e.cnpj)]===sig) return;
    if(c.nome) e.nome_fantasia=c.nome;
    if(c.categoria){
      e.categoria=c.categoria;
      var cn=String(e.cnpj||'').replace(/\D/g,''), naoAlim=['Posto','Construção','Móveis','Vestuário','Loja de departamento','Automotivo','Alimentação','Digital','Gás e Água','Serviços','Outro','Supermercado','Atacado'];
      (DB.notas_fiscais||[]).forEach(function(n){
        if(String(n.cnpj||'').replace(/\D/g,'')!==cn || n.tipo_loja===c.categoria) return;
        var antigo=n.tipo_loja; n.tipo_loja=c.categoria; r.tipoLoja++;
        (DB.itens||[]).forEach(function(it){
          if(it.nota_id!==n.id || it.categoria!==antigo) return;
          it.categoria=(LOJAS_ALIMENTO.indexOf(c.categoria)>=0 && c.categoria!=='Atacado')?gCat(it.descricao):c.categoria; it.local=gLocal(it.categoria);
        });
      });
    }
    ok[String(e.cnpj)]=sig; r.fantasia++;
  });
  // 4) cadastro de estabelecimentos
  (DB.estabelecimentos||[]).forEach(function(e){
    var c=normCidade(e.cidade); if(c!==e.cidade){ e.cidade=c; r.cidades++; }
    if(!String(e.nome_fantasia||'').trim() && e.razao_social){ e.nome_fantasia=nomeFantasiaDe(e.razao_social); r.fantasia++; }
  });
  var total=0; Object.keys(r).forEach(function(k){total+=r[k];});
  r.total=total;
  if(total){ DB._migr=DB._migr||{}; DB._migr.qual_log=(DB._migr.qual_log||[]).concat([{em:new Date().toISOString().substring(0,16),r:r}]).slice(-10); }
  return r;
}

function auditarDados(){
  var notas=DB.notas_fiscais||[], itens=DB.itens||[], out={};
  var soma={}, qtd={}; itens.forEach(function(i){ soma[i.nota_id]=(soma[i.nota_id]||0)+(Number(i.valor_total)||0); qtd[i.nota_id]=(qtd[i.nota_id]||0)+1; });
  out.divergentes=notas.filter(function(n){ return qtd[n.id] && Math.abs((soma[n.id]||0)-(Number(n.desconto_total)||0)-(Number(n.valor_total)||0))>0.05; }).map(function(n){ return {n:n,itens:soma[n.id]||0}; });
  out.semItens=notas.filter(function(n){return !qtd[n.id];});
  out.valorZero=notas.filter(function(n){return !Number(n.valor_total);});
  var ids={}; notas.forEach(function(n){ids[n.id]=1;});
  out.itensOrfaos=itens.filter(function(i){return !ids[i.nota_id];});
  out.itensZerados=itens.filter(function(i){return !Number(i.valor_total);});
  var g1={}; notas.forEach(function(n){ var k=[String(n.cnpj||'').replace(/\D/g,''),n.data_emissao,Number(n.valor_total).toFixed(2)].join('#'); (g1[k]=g1[k]||[]).push(n); });
  out.suspeitas=Object.values(g1).filter(function(a){return a.length>1;});
  var cn={}; (DB.estabelecimentos||[]).forEach(function(e){ cn[String(e.cnpj||'').replace(/\D/g,'')]=1; });
  out.semCadastro=notas.filter(function(n){return !cn[String(n.cnpj||'').replace(/\D/g,'')];});
  var ch={}; notas.forEach(function(n){ch[n.chave_acesso]=1;});
  out.estoqueOrfao=(DB.estoque||[]).filter(function(e){return e.nota_chave && !ch[e.nota_chave];});
  out.outros=notas.filter(function(n){return n.tipo_loja==='Outro';});
  return out;
}

function tint(hex, amt){
  hex = hex||'#9e9e9e';
  var r=parseInt(hex.slice(1,3),16), gg=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  var nr=Math.round(r*amt+255*(1-amt)), ng=Math.round(gg*amt+255*(1-amt)), nb=Math.round(b*amt+255*(1-amt));
  return 'rgb('+nr+','+ng+','+nb+')';
}
function shade(hex, amt){
  hex = hex||'#616161';
  var r=parseInt(hex.slice(1,3),16), gg=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  var nr=Math.round(r*(1-amt)), ng=Math.round(gg*(1-amt)), nb=Math.round(b*(1-amt));
  return 'rgb('+nr+','+ng+','+nb+')';
}
function luminance(hex){
  hex = hex||'#616161';
  var r=parseInt(hex.slice(1,3),16)/255, gg=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  function lin(c){ return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
  return 0.2126*lin(r)+0.7152*lin(gg)+0.0722*lin(b);
}
function catPill(cat){
  var c=COR[cat]||'#616161';
  var textColor = luminance(c) > 0.30 ? shade(c,.38) : c;
  return '<span class="pill-cat" style="background:'+tint(c,.26)+';color:'+textColor+'">'+esc(cat||'—')+'</span>';
}
function trendHtml(pct, goodWhenUp){
  if(pct===null) return '';

  var icon = isUp ? ICONS.up : ICONS.down;
  return '<div class="trend '+cls+'">'+icon+'<span>'+(isUp?'+':'')+pct.toFixed(1)+'%</span></div>';

function mesKey(m){ m=String(m||''); return /^\d{2}\/\d{4}$/.test(m)? m.substring(3)+'-'+m.substring(0,2) : m; }

function mesStr(d){ if(!d)return'N/A'; d=String(d); if(d.includes('/'))return d.substring(3,5)+'/'+d.substring(6,10); return d.length>=7?d.substring(0,7):'N/A'; }

function normPagto(f){
  f=String(f||'').toLowerCase();
  if(/crédit|credito|credit/.test(f))return'Cartão de Crédito';
  if(/débit|debito|debit/.test(f))return'Cartão de Débito';
  if(/pix/.test(f))return'Pix';
  if(/dinheir|espéci|especie|dinheiro/.test(f))return'Dinheiro';
  if(!f.trim()||f==='-')return'Não informado';
  // Remove valores monetários e tenta novamente (ex: "Cartão de Débito: R$164.76")
  var limpo=f.replace(/r\$[\d.,]+/gi,'').replace(/:\s*/g,' ').trim();
  if(limpo!==f) return normPagto(limpo);
  return'Outros';
}

function sugerirNomeLimpo(raw){
  var toks=String(raw||'').trim().split(/\s+/);
  var pesoParts=[], rest=[];
  var UNIT_RE=/^(\d+[.,]?\d*)(KG|G|ML|L|UN|UND|UNID|CX|PCT)$/i;
  var UNIT_ONLY_RE=/^(KG|G|ML|L|UN|UND|UNID|CX|PCT)$/i;
  var NUM_RE=/^\d+[.,]?\d*$/;
  for(var i=0;i<toks.length;i++){
    var t=toks[i];
    var m=t.match(UNIT_RE);
    if(m){ pesoParts.push(m[1].replace(',','.')+m[2].toLowerCase()); continue; }
    if(NUM_RE.test(t) && i+1<toks.length && UNIT_ONLY_RE.test(toks[i+1])){
      pesoParts.push(t.replace(',','.')+toks[i+1].toLowerCase()); i++; continue;
    }
    rest.push(t);
  }
  var expandido=rest.map(function(w){
    var up=w.toUpperCase().replace(/[^A-ZÀ-Ú]/g,'');
    var full=ABREV_MAP[up];
    var base=(full!==undefined)?full:w;
    if(!base) return '';
    return base.charAt(0).toUpperCase()+base.slice(1).toLowerCase();
  }).filter(Boolean);
  var nome=expandido.join(' ');
  if(pesoParts.length) nome+=(nome?' ':'')+pesoParts.join(' ');
  return nome.trim() || String(raw||'').trim();
}
function normProdName(s){
  return String(s||'').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function tokenSet(s){ return new Set(normProdName(s).split(' ').filter(Boolean)); }
function jaccard(aSet,bSet){
  var inter=0; aSet.forEach(function(t){ if(bSet.has(t)) inter++; });
  var union=aSet.size+bSet.size-inter;
  return union? inter/union : 0;
}
function matchProduto(rawDesc){
  var aSet=tokenSet(rawDesc);
  if(!aSet.size) return null;
  var best=null, bestScore=0;
  (DB.produtos||[]).forEach(function(p){
    var score=jaccard(aSet, tokenSet(p.nome));
    if(score>bestScore){ bestScore=score; best=p; }
  });
  return (best && bestScore>=0.45) ? {nome:best.nome, score:bestScore} : null;
}

}

function scrollParaProximoPendente(ctx, indiceAtual){
  var itens=itensArrayFor(ctx);

  for(var k=indiceAtual+1;k<itens.length;k++){ if(!itens[k].confirmado){ proximo=k; break; } }
  if(proximo===-1){
    for(var k2=0;k2<itens.length;k2++){ if(!itens[k2].confirmado){ proximo=k2; break; } }
  }
  if(proximo>=0){
    setTimeout(function(){
      var el=document.getElementById('prod-row-'+ctx+'-'+proximo);
      if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 30);

function parseNF(html){
  var doc=new DOMParser().parseFromString(html,'text/html');
  var topo=doc.querySelector('#u20,.txtTopo');
  var estab=topo?topo.textContent.trim():'Não identificado';
  var cm=html.match(/\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}/);
  var cnpj=cm?cm[0]:'';
  var ce=doc.querySelector('span.chave');
  var chave=ce?ce.textContent.replace(/\s+/g,''):'';
  var dm=html.match(/(\d{2}\/\d{2}\/\d{4})/);
  var data=dm?dm[1]:'';
  var rua='',num='',bairro='',cidade='',estado='';
  var dts=doc.querySelectorAll('div.text');
  if(dts.length>=2){
    var pts=dts[1].textContent.split(',').map(function(p){return p.trim();}).filter(function(p){return p;});
    if(pts.length>=1)rua=pts[0];
    if(pts.length>=2)num=pts[1];
    if(pts.length>=3)estado=pts[pts.length-1];
    if(pts.length>=4)cidade=pts[pts.length-2];
    if(pts.length>=5)bairro=pts[pts.length-3];
  }
  var itens=[];
  doc.querySelectorAll('#tabResult tr').forEach(function(row){
    var de=row.querySelector('span.txtTit, span.txtTit2'); if(!de)return;
    var qe=row.querySelector('span.Rqtd');
    var ue=row.querySelector('span.RUN');
    var vue=row.querySelector('span.RvlUnit');
    var vte=row.querySelector('span.valor');
    var qm=(qe?qe.textContent:'1').match(/[\d,\.]+\s*$/);
    var qtd=qm?parseFloat(qm[0].replace(',','.')):1;
    var pR=function(s){return parseFloat((s||'0').replace(/[^0-9,]/g,'').replace(',','.'))||0;};
    var desc=de.textContent.trim();
    var match=matchProduto(desc);
    var prodRef=match?produtoPorNome(match.nome):null;
    itens.push({descricao:match?match.nome:sugerirNomeLimpo(desc),descricaoOriginal:desc,descricaoSugerida:match?match.nome:null,confirmado:false,
      quantidade:qtd,unidade:ue?ue.textContent.replace(/^\s*UN:\s*/i,'').trim():'un',
      valorUnitario:pR(vue?vue.textContent:'0'),valorTotal:pR(vte?vte.textContent:'0'),
      marca:(prodRef&&prodRef.marca)||gMarca(desc),categoria:(prodRef&&prodRef.categoria)||gCat(desc),local:''});
  });
  var tot=0,desc_=0,pagar=0,trib=0,forma='';
  var tn=doc.getElementById('totalNota');
  if(tn){
    tn.querySelectorAll('[id="linhaTotal"]').forEach(function(l){
      var lbEl=l.querySelector('label'), ss=l.querySelectorAll('span'); if(!lbEl||!ss.length)return;
      var lb=lbEl.textContent.toLowerCase().replace(/\s+/g,' ').trim();
      var val=parseFloat(ss[ss.length-1].textContent.replace(/\./g,'').replace(',','.'))||0;
      if(lb.includes('valor total'))tot=val;
      else if(lb.includes('desconto'))desc_=val;
      else if(lb.includes('pagar'))pagar=val;
      else if(lb.includes('tributo')||lb.includes('12.741'))trib=val;
      else if(!forma&&lbEl.classList.contains('tx'))forma=lbEl.textContent.replace(/\s+/g,' ').trim();
    });
  }
  itens.forEach(function(it){if(!it.local)it.local=gLocal(it.categoria);});
  return{chave:chave,estabelecimento:estab,cnpj:cnpj,dataEmissao:data,
    rua:rua,numero:num,bairro:bairro,cidade:cidade,estado:estado,
    valorTotal:pagar||tot,descontoTotal:desc_,tributosSefaz:trib,tributosImpresso:trib,
    formaPagamento:forma,itens:itens};
}

function okImport(d){
  _notaAtual=null;
  var dias = d ? diasDesde(d.dataEmissao) : 999;
  if(d && dias>=0 && dias<=3){
    mostrarControleValidade(d);
    return;
  }
  setPage('<div style="max-width:480px;text-align:center;padding:40px"><div style="font-size:56px;margin-bottom:14px">✅</div><h3>Nota importada!</h3><p style="color:var(--text-2);margin:12px 0">Dados disponíveis em todos os módulos.</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><button class="btn bg" onclick="go(\'importar\')">📥 Nova importação</button><button class="btn bp" onclick="go(\'dashboard\')">📊 Dashboard</button></div></div>');
}
function mostrarControleValidade(d){
  d.itens.forEach(function(it){
    if(it._acabou===undefined) it._acabou=false;
    if(it._validade===undefined) it._validade='';
    if(it._disponivel===undefined) it._disponivel=true;
  });
  window._validadeNota=d;
  var rows=d.itens.map(function(it,i){
    var perecivel=PERECIVEL_SEM_VALIDADE.indexOf(it.categoria)!==-1;
    var campo;
    if(perecivel){
      campo='<div style="display:flex;gap:6px;flex-wrap:wrap">'+
        '<button class="btn '+(it._disponivel?'bs':'bg')+' bsm" onclick="setDisponivelItem('+i+',true)">Disponível</button>'+
        '<button class="btn '+(!it._disponivel?'bd':'bg')+' bsm" onclick="setDisponivelItem('+i+',false)">Já acabou</button>'+
        '</div>';
    } else {
      campo='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+
        '<input type="date" value="'+(it._validade||'')+'" style="padding:5px;border:1px solid var(--border-c);border-radius:5px;font-size:12px;background:var(--bg-card);color:var(--text-1)" onchange="setValidadeItem('+i+',this.value)" '+(it._acabou?'disabled':'')+'>'+
        '<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-2);cursor:pointer"><input type="checkbox" '+(it._acabou?'checked':'')+' onchange="setAcabouItem('+i+',this.checked)"> Já acabou</label>'+
        '</div>';
    }
    return '<tr><td style="color:var(--text-2)">'+(i+1)+'</td><td style="font-weight:600;font-size:12px">'+esc(it.descricao)+'</td><td>'+catPill(it.categoria)+'</td><td>'+campo+'</td></tr>';
  }).join('');
  setPage(
    '<div class="card">'+
    '<div class="card-hd" style="flex-direction:column;align-items:flex-start;gap:2px">'+
    '<div>🗓️ Controle de validade</div>'+
    '<div style="font-weight:400;color:var(--text-2);font-size:11px">Compra recente — informe a validade de cada item ou marque o que já acabou. Frutas, legumes e vegetais usam apenas disponível/acabou.</div>'+
    '</div>'+
    '<div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Produto</th><th>Categoria</th><th>Validade / Disponibilidade</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div style="padding:14px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--border-c)">'+
    '<button class="btn bg" onclick="pularControleValidade()">Pular esta etapa</button>'+
    '<button class="btn bs" onclick="salvarControleValidade()">💾 Salvar no Estoque</button>'+
    '</div></div>'
  );
}
function setDisponivelItem(i,val){ window._validadeNota.itens[i]._disponivel=val; mostrarControleValidade(window._validadeNota); }
function setAcabouItem(i,val){ window._validadeNota.itens[i]._acabou=val; mostrarControleValidade(window._validadeNota); }
function setValidadeItem(i,val){ window._validadeNota.itens[i]._validade=val; }
function pularControleValidade(){
  window._validadeNota=null;
  setPage('<div style="max-width:480px;text-align:center;padding:40px"><div style="font-size:56px;margin-bottom:14px">✅</div><h3>Nota importada!</h3><p style="color:var(--text-2);margin:12px 0">Dados disponíveis em todos os módulos.</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><button class="btn bg" onclick="go(\'importar\')">📥 Nova importação</button><button class="btn bp" onclick="go(\'dashboard\')">📊 Dashboard</button></div></div>');
}
async function salvarControleValidade(){
  var d=window._validadeNota;
  for(var i=0;i<d.itens.length;i++){
    var it=d.itens[i];
    var perecivel=PERECIVEL_SEM_VALIDADE.indexOf(it.categoria)!==-1;
    var status=perecivel?(it._disponivel?'disponivel':'acabou'):(it._acabou?'acabou':'disponivel');
    var validade=perecivel?'':(it._validade||'');
    var exist=(DB.estoque||[]).find(function(e){return e.status==='disponivel'&&String(e.descricao||'').toLowerCase()===String(it.descricao||'').toLowerCase();});
    if(exist && status==='disponivel'){
      await sb.from('estoque').update({quantidade:(Number(exist.quantidade)||0)+(Number(it.quantidade)||1), validade:validade||exist.validade, revisado:1}).eq('id',exist.id);
    } else {
      await sb.from('estoque').insert({
        descricao:it.descricao, marca:it.marca||'', categoria:it.categoria||'', local:gLocal(it.categoria),
        quantidade:it.quantidade||1, unidade:it.unidade||'un', validade:validade||null,
        nota_chave:d.chave||'', data_entrada:nowISODate(), status:status, revisado:1
      });
    }
  }
  window._validadeNota=null;
  setPage('<div style="max-width:480px;text-align:center;padding:40px"><div style="font-size:56px;margin-bottom:14px">✅</div><h3>Estoque atualizado!</h3><p style="color:var(--text-2);margin:12px 0">A validade e disponibilidade dos itens foram registradas.</p><div style="display:flex;gap:10px;justify-content:center;margin-top:20px"><button class="btn bg" onclick="go(\'estoque\')">📦 Ver Estoque</button><button class="btn bp" onclick="go(\'dashboard\')">📊 Dashboard</button></div></div>');
}

var _anaPeriodoDias = 30;
function parseDateBR(d){
  if(!d) return null; d=String(d);
  if(d.includes('/')){ var p=d.split('/'); return new Date(Number(p[2]),Number(p[1])-1,Number(p[0])); }
  return null;
}
function mudarPeriodoAnalise(){
  _anaPeriodoDias = Number(v('periodo-an'))||30;
  pgAnal();
}
async function pgAnal(){
  setActs(
    '<select id="periodo-an" class="select-period" onchange="mudarPeriodoAnalise()">'+
    '<option value="7"'+(_anaPeriodoDias===7?' selected':'')+'>Última semana</option>'+
    '<option value="30"'+(_anaPeriodoDias===30?' selected':'')+'>Últimos 30 dias</option>'+
    '<option value="90"'+(_anaPeriodoDias===90?' selected':'')+'>Últimos 90 dias</option>'+
    '<option value="180"'+(_anaPeriodoDias===180?' selected':'')+'>Últimos 6 meses</option>'+
    '<option value="365"'+(_anaPeriodoDias===365?' selected':'')+'>Último ano</option>'+
    '</select> <button class="btn bg bsm" onclick="pgAnal()">↺ Atualizar</button>'
  );
  try{
    var {data:allItens,error} = await sb.from('itens').select('*');
    if(error) throw error;
    if(!allItens||!allItens.length){ setPage('<div class="empty"><div class="empty-i">📊</div><p>Nenhum dado ainda.</p></div>'); return; }
    var {data:notasAll} = await sb.from('notas_fiscais').select('*');
    var {data:estabsAll} = await sb.from('estabelecimentos').select('*');
    notasAll = notasAll||[];
    estabsAll = estabsAll||[];
    var estabNomeMap={}; estabsAll.forEach(function(e){ if(e.cnpj) estabNomeMap[e.cnpj]=(String(e.nome_fantasia||'').trim())||String(e.razao_social||'')||e.cnpj; });
    var notaEstabMap={}; notasAll.forEach(function(n){ notaEstabMap[n.id]=estabNomeMap[n.cnpj]||n.estabelecimento; });

    var cutoff = new Date();
    cutoff.setDate(cutoff.getDate()-_anaPeriodoDias);
    cutoff.setHours(0,0,0,0);
    var notasNoPeriodo = notasAll.filter(function(n){ var dt=parseDateBR(n.data_emissao); return dt && dt>=cutoff; });
    var idsPeriodo = {}; notasNoPeriodo.forEach(function(n){ idsPeriodo[n.id]=true; });
    var data = allItens.filter(function(it){ return idsPeriodo[it.nota_id]; });

    if(!data.length){
      setPage('<div class="empty"><div class="empty-i">📊</div><p>Nenhuma compra no período selecionado.</p><p style="font-size:12px;margin-top:6px">Tente um período maior no filtro acima.</p></div>');
      return;
    }

    var grupos={};
    var prodCatMap={};
    (DB.produtos||[]).forEach(function(p){ if(p.nome&&p.categoria) prodCatMap[normProdName(p.nome)]=p.categoria; });
    data.forEach(function(it){
      var key=normProdName(it.descricao||''); if(!key)return;
      var cat=it.categoria||prodCatMap[key]||gCat(it.descricao||'');
      if(!grupos[key])grupos[key]={descricao:it.descricao,marca:it.marca||'',categoria:cat,precos:[],total:0,vezes:0};
      var p=Number(it.valor_unitario)||0;
      if(p>0){ grupos[key].precos.push(p); grupos[key].total+=p; grupos[key].vezes++; }
      if(it.categoria) grupos[key].categoria=it.categoria;
      else if(cat && !grupos[key].categoria) grupos[key].categoria=cat;
    });
    var lista=Object.values(grupos).filter(function(gr){return gr.vezes>0;}).map(function(gr){return{
      descricao:gr.descricao, marca:gr.marca, categoria:gr.categoria,
      preco_min:Math.min.apply(null,gr.precos), preco_max:Math.max.apply(null,gr.precos),
      preco_medio:gr.total/gr.vezes, vezes_comprado:gr.vezes,
      economia:gr.total-(Math.min.apply(null,gr.precos)*gr.vezes)
    };}).sort(function(a,b){return b.vezes_comprado-a.vezes_comprado;});
    var _d=lista;

    var totalProdutos=lista.length;
    var economiaPotencial=lista.reduce(function(s,r){return s+r.economia;},0);
    var maiorVar=lista.slice().sort(function(a,b){return (b.preco_max-b.preco_min)-(a.preco_max-a.preco_min);})[0];

    // Meta de Gastos Mensais
    var hoje=new Date(), curMes=hoje.getMonth()+1, curAno=hoje.getFullYear();
    function ehMesAtual(d){
      if(!d) return false; d=String(d);
      if(d.includes('/')){ var p=d.split('/'); return Number(p[1])===curMes && Number(p[2])===curAno; }
      return false;
    }
    var gastoMes = notasAll.filter(function(n){return ehMesAtual(n.data_emissao);}).reduce(function(s,n){return s+(Number(n.valor_total)||0);},0);
    var metaRow = (DB.configuracoes||[]).find(function(c){return c.chave==='meta_gastos_mensal';});
    var meta = metaRow ? Number(metaRow.valor)||0 : 0;
    var pctMeta = meta>0 ? Math.min(100, Math.round((gastoMes/meta)*100)) : 0;
    var estourou = meta>0 && gastoMes>meta;
    var corMeta = estourou ? '#EA4335' : '#1A73E8';
    var metaHtml;
    if(meta>0){
      metaHtml =
        '<div class="l2">Meta de Gastos Mensais</div>'+
        '<div class="meta-ring-lg" style="background:conic-gradient('+corMeta+' '+(pctMeta*3.6)+'deg, var(--bg-stripe) 0deg)"><div class="meta-ring-lg-inner">'+pctMeta+'%</div></div>'+
        '<div style="font-size:13px;color:var(--text-2)">'+brl(gastoMes)+' de '+brl(meta)+'</div>'+
        (estourou? '<div style="font-size:12px;color:#EA4335;font-weight:700">Meta estourada</div>' : '<div style="font-size:12px;color:var(--text-2)">Restam '+brl(Math.max(0,meta-gastoMes))+'</div>')+
        '<a class="kpi-what" onclick="abrirMeta('+meta+')" style="margin-top:6px">✏️ Editar meta</a>';
    } else {
      metaHtml =
        '<div class="kpi-ic ic-b" style="margin:0 auto">'+ICONS.percent+'</div>'+
        '<div class="l2">Meta de Gastos Mensais</div>'+
        '<div style="font-size:12px;color:var(--text-2)">Defina um orçamento e acompanhe quanto já gastou este mês.</div>'+
        '<button class="btn bp bsm" onclick="abrirMeta(0)" style="margin-top:6px">Definir meta</button>';
    }

    // Comparativo do item de maior variação entre supermercados
    var lojasChartHtml='';
    if(maiorVar){
      var itensDoProduto = data.filter(function(it){return normProdName(it.descricao)===normProdName(maiorVar.descricao);});
      var porLoja={};
      itensDoProduto.forEach(function(it){
        var loja = notaEstabMap[it.nota_id]||'Desconhecido';
        if(!porLoja[loja]) porLoja[loja]={soma:0,qtd:0};
        porLoja[loja].soma+=Number(it.valor_unitario)||0; porLoja[loja].qtd++;
      });
      var lojasArr = Object.entries(porLoja).map(function(e){return{loja:e[0],preco:e[1].soma/e[1].qtd};}).sort(function(a,b){return a.preco-b.preco;});
      if(lojasArr.length>1){
        var alturaChart = Math.max(260, lojasArr.length*60 + 100);
        lojasChartHtml = '<div class="ch ch-h" style="height:'+alturaChart+'px;margin:0;overflow:hidden"><h4>Comparativo de preços por supermercado — '+esc(maiorVar.descricao)+'</h4><canvas id="ch-lojas"></canvas></div>';
      }
    }

    function rend(items){
      g('tb-anal').innerHTML=items.map(function(r){
        var alertaArg = JSON.stringify({descricao:r.descricao,categoria:r.categoria,marca:r.marca,preco:r.preco_medio}).replace(/"/g,'&quot;');
        return '<tr><td>'+esc(r.descricao)+'</td><td>'+catPill(r.categoria)+'</td><td style="color:var(--text-2)">'+esc(r.marca||'—')+'</td>'+
          '<td><span class="tag tgn" style="font-size:calc(12.5px * var(--fs,1));padding:4px 11px">'+brl(r.preco_min)+'</span></td>'+
          '<td style="color:#EA4335;font-weight:600">'+brl(r.preco_max)+'</td>'+
          '<td><span class="tag tbl" style="font-size:calc(12.5px * var(--fs,1));padding:4px 11px">'+brl(r.preco_medio)+'</span></td>'+
          '<td style="text-align:center"><span class="tag tbl">'+r.vezes_comprado+'x</span></td>'+
          '<td style="text-align:center;color:'+(r.preco_max-r.preco_min>2?'#EA4335':'#34A853')+'">±'+brl(r.preco_max-r.preco_min)+'</td>'+
          '<td style="text-align:center"><button class="bell-btn" title="Criar alerta de preço" onclick="abrirAlerta('+alertaArg+')">🔔</button></td></tr>';
      }).join('');
      g('cnt-an').textContent=items.length+' produtos';
    }
    setPage(
      '<div class="ana-layout">'+
      '<div class="ana-kpis">'+
      '<div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-b">'+ICONS.filetxt+'</div><div class="l2">Produtos Analisados</div></div><div class="v2">'+totalProdutos+'</div></div>'+
      '<div class="kpi"><button class="kpi-info" onclick="mostrarInfoEconomia()">?</button><div class="kpi-top"><div class="kpi-ic ic-g">'+ICONS.percent+'</div><div class="l2">Economia Potencial</div></div><div class="v2" style="color:#34A853">'+brl(economiaPotencial)+'</div><div class="s">se sempre comprasse no menor preço</div><a class="kpi-what" onclick="mostrarInfoEconomia()">O que é isso?</a></div>'+
      '<div class="kpi"><button class="kpi-info" onclick="mostrarInfoVariacao()">?</button><div class="kpi-top"><div class="kpi-ic ic-r">'+ICONS.receipt+'</div><div class="l2">Maior Variação</div></div><div class="v2" style="font-size:calc(19px * var(--fs,1))">'+esc((maiorVar&&maiorVar.descricao)||'—')+'</div><div class="s" style="color:#EA4335;font-weight:700">±'+brl(maiorVar?maiorVar.preco_max-maiorVar.preco_min:0)+'</div><a class="kpi-what" onclick="mostrarInfoVariacao()">O que é isso?</a></div>'+
      '</div>'+
      '<div class="ana-chart-cell">'+lojasChartHtml+'</div>'+
      '<div class="ana-meta-cell">'+metaHtml+'</div>'+
      '</div>'+
      '<div class="tbar"><input type="text" id="q-an" placeholder="🔍 Filtrar produto ou marca..." oninput="filtAn()" style="width:260px"><span id="cnt-an" style="color:var(--text-2);font-size:12px">'+lista.length+' produtos</span></div>'+
      '<div class="card"><div class="card-hd">Comparativo de preços por produto</div><table><thead><tr><th>Produto</th><th>Categoria</th><th>Marca</th><th style="color:#34A853">Mín.</th><th style="color:#EA4335">Máx.</th><th>Médio</th><th>Freq.</th><th>Variação</th><th>Alerta</th></tr></thead><tbody id="tb-anal"></tbody></table></div>'
    );
    rend(lista);
    window.filtAn=function(){ var q=(v('q-an')||'').toLowerCase(); rend(q?_d.filter(function(r){return r.descricao.toLowerCase().includes(q)||(r.marca||'').toLowerCase().includes(q);}):_d); };

    if(maiorVar){
      setTimeout(function(){
        var elL=g('ch-lojas');
        if(elL){
          var itensDoProduto2 = data.filter(function(it){return normProdName(it.descricao)===normProdName(maiorVar.descricao);});
          var porLoja2={};
          itensDoProduto2.forEach(function(it){
            var loja = notaEstabMap[it.nota_id]||'Desconhecido';
            if(!porLoja2[loja]) porLoja2[loja]={soma:0,qtd:0};
            porLoja2[loja].soma+=Number(it.valor_unitario)||0; porLoja2[loja].qtd++;
          });
          var lojasArr2 = Object.entries(porLoja2).map(function(e){return{loja:e[0],preco:e[1].soma/e[1].qtd};}).sort(function(a,b){return a.preco-b.preco;});
          try{ CHARTS.lojas = criarGraficoComFonte(elL,{type:'bar',data:{labels:lojasArr2.map(function(x){return x.loja;}),datasets:[{data:lojasArr2.map(function(x){return x.preco;}),backgroundColor:lojasArr2.map(function(x,i){return CORES[i%CORES.length];}),borderRadius:6,barPercentage:0.55,categoryPercentage:0.7}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:16,top:8,bottom:4}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return brl(ctx.parsed.x);}}}},scales:{x:{ticks:{font:{size:13},maxTicksLimit:6,callback:function(vv){return brl(vv);}}},y:{ticks:{font:{size:14}}}}}}); }catch(e){ console.warn('Gráfico falhou ao renderizar:', e); }
        }
      }, 80);
    }
  }catch(e){ err(e); }
}

async function salvarMeta(){
  var val = parseFloat(v('meta-v'))||0;
  closeMo();
  var existing = (DB.configuracoes||[]).find(function(c){return c.chave==='meta_gastos_mensal';});
  if(existing) await sb.from('configuracoes').update({valor:String(val)}).eq('chave','meta_gastos_mensal');
  else await sb.from('configuracoes').insert({chave:'meta_gastos_mensal', valor:String(val)});

}

async function salvarAlerta(item){
  var alvo = parseFloat(v('alerta-v'))||0;

}

// ══════════════════════════════════════════════════════════════════
var _res=null;
async function pgRes(){
  try{
    var {data:notas,error} = await sb.from('notas_fiscais').select('*');
    if(error) throw error;
    if(!notas||!notas.length){ setPage('<div class="empty"><div class="empty-i">📋</div><p>Nenhuma nota.</p></div>'); return; }
    var {data:estabsRes} = await sb.from('estabelecimentos').select('*');
    estabsRes=estabsRes||[];
    var estabNomeRes={};
    estabsRes.forEach(function(e){ if(e.cnpj) estabNomeRes[e.cnpj]=(String(e.nome_fantasia||'').trim())||String(e.razao_social||'')||e.cnpj; });

    var totais={gasto:0,desconto:0,tributos:0,qtdNotas:notas.length};
    var tribSefaz=0,tribImpresso=0;
    notas.forEach(function(n){
      totais.gasto+=Number(n.valor_total)||0;
      totais.desconto+=Number(n.desconto_total)||0;
      totais.tributos+=Number(n.tributos_total)||0;
      tribSefaz+=Number(n.tributos_sefaz)||0;
      tribImpresso+=Number(n.tributos_impressos)||0;
    });
    var porNota=notas.map(function(n){return{data:n.data_emissao,estab:estabNomeRes[n.cnpj]||n.estabelecimento,
      valor:Number(n.valor_total)||0,desconto:Number(n.desconto_total)||0,
      tribSefaz:Number(n.tributos_sefaz)||0,tribImpresso:Number(n.tributos_impressos)||0,
      forma:n.forma_pagamento};}).sort(function(a,b){return String(a.data||'')>String(b.data||'')?1:-1;});

    var mMap={};
    notas.forEach(function(n){
      var m=mesStr(n.data_emissao); if(m==='N/A')return;
      if(!mMap[m])mMap[m]={mes:m,total:0,qtd:0,desconto:0,tribSefaz:0,tribImpresso:0};
      mMap[m].total+=Number(n.valor_total)||0; mMap[m].qtd++;
      mMap[m].desconto+=Number(n.desconto_total)||0;
      mMap[m].tribSefaz+=Number(n.tributos_sefaz)||0;
      mMap[m].tribImpresso+=Number(n.tributos_impressos)||0;
    });
    var aMap={};
    notas.forEach(function(n){ var a=anoStr(n.data_emissao); if(!aMap[a])aMap[a]={ano:a,total:0,qtd:0,desconto:0}; aMap[a].total+=Number(n.valor_total)||0; aMap[a].qtd++; aMap[a].desconto+=Number(n.desconto_total)||0; });
    var pMap={};
    notas.forEach(function(n){ var c=normPagto(n.forma_pagamento); if(!pMap[c])pMap[c]={forma:c,qtd:0,total:0}; pMap[c].qtd++; pMap[c].total+=Number(n.valor_total)||0; });

    var mesesOrd=Object.keys(mMap).sort(cmpMes);
    var mAtual = mesesOrd.length? mMap[mesesOrd[mesesOrd.length-1]] : null;
    var mAnt   = mesesOrd.length>1? mMap[mesesOrd[mesesOrd.length-2]] : null;
    var pctChange=function(atual,ant){ return ant?((atual-ant)/ant*100):null; };
    var trendGasto  = (mAtual&&mAnt)? pctChange(mAtual.total,mAnt.total) : null;
    var trendDesc   = (mAtual&&mAnt)? pctChange(mAtual.desconto,mAnt.desconto) : null;
    var trendTribS  = (mAtual&&mAnt)? pctChange(mAtual.tribSefaz,mAnt.tribSefaz) : null;
    var trendTribI  = (mAtual&&mAnt)? pctChange(mAtual.tribImpresso,mAnt.tribImpresso) : null;

    _res={totais:totais,tribSefaz:tribSefaz,tribImpresso:tribImpresso,porNota:porNota,
      porMes:Object.values(mMap).sort(function(a,b){return cmpMes(a.mes,b.mes);}).slice(-24),
      porAno:Object.values(aMap).sort(function(a,b){return a.ano>b.ano?1:-1;}),
      pagamentos:Object.values(pMap).sort(function(a,b){return b.qtd-a.qtd;})};

    setPage(
      '<div class="kpis">'+
      '<div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-b">'+ICONS.wallet+'</div><div class="l2">Total Gasto</div></div><div class="v2">'+brl(totais.gasto)+'</div>'+trendHtml(trendGasto,false)+'</div>'+
      '<div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-g">'+ICONS.percent+'</div><div class="l2">Descontos</div></div><div class="v2" style="color:#34A853">'+brl(totais.desconto)+'</div>'+trendHtml(trendDesc,true)+'</div>'+
      '<div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-r">'+ICONS.filetxt+'</div><div class="l2">Tributos SEFAZ</div></div><div class="v2" style="color:#EA4335">'+brl(tribSefaz)+'</div>'+trendHtml(trendTribS,false)+'</div>'+
      '<div class="kpi"><div class="kpi-top"><div class="kpi-ic ic-r">'+ICONS.receipt+'</div><div class="l2">Tributos Impressos</div></div><div class="v2" style="color:#E65100">'+brl(tribImpresso)+'</div>'+(Math.abs(tribImpresso-tribSefaz)>0.01?'<div class="s" style="color:#EA4335">Diferença: '+brl(tribImpresso-tribSefaz)+'</div>':trendHtml(trendTribI,false))+'</div>'+
      '</div>'+
      '<div class="stabs">'+
      '<button class="stab on" onclick="stab(\'notas\',this)">Por Nota</button>'+
      '<button class="stab" onclick="stab(\'mes\',this)">Por Mês</button>'+
      '<button class="stab" onclick="stab(\'ano\',this)">Por Ano</button>'+
      '<button class="stab" onclick="stab(\'pagto\',this)">Pagamentos</button>'+
      '</div><div id="st-body"></div>'
    );
    stab('notas',document.querySelector('.stab.on'));
  }catch(e){ err(e); }
}
function stab(tab,btn){
  document.querySelectorAll('.stab').forEach(function(b){b.classList.remove('on');});
  if(btn)btn.classList.add('on');
  var d=_res; if(!d)return;
  if(tab==='notas'){
    g('st-body').innerHTML='<div class="card"><div class="card-hd">Gastos por nota</div><table><thead><tr><th>Data</th><th>Estabelecimento</th><th>Valor</th><th>Desconto</th><th>Trib.SEFAZ</th><th>Trib.Impresso</th><th>Pagamento</th></tr></thead><tbody>'+
      (d.porNota||[]).map(function(n){return '<tr><td style="color:var(--text-2)">'+fmt(n.data)+'</td><td>'+esc(String(n.estab||'').substring(0,26))+'</td><td style="font-weight:600">'+brl(n.valor)+'</td><td style="color:#34A853">'+brl(n.desconto)+'</td><td style="color:#EA4335">'+brl(n.tribSefaz)+'</td><td style="color:'+(Math.abs((n.tribImpresso||0)-(n.tribSefaz||0))>0.01?'#E65100':'#34A853')+';font-weight:600">'+brl(n.tribImpresso)+'</td><td>'+tagPagto(normPagto(n.forma||''))+'</td></tr>';}).join('')+
      '</tbody></table></div>';
  } else if(tab==='mes'){
    g('st-body').innerHTML='<div class="g2"><div class="ch ch-h" style="height:280px"><h4>Gastos mensais</h4><canvas id="ch-m"></canvas></div>'+
      '<div class="card"><div class="card-hd">Detalhe por mês</div><table><thead><tr><th>Mês</th><th>Total</th><th>Notas</th><th>Ticket</th></tr></thead><tbody>'+
      (d.porMes||[]).map(function(m){return '<tr><td style="font-weight:600">'+m.mes+'</td><td>'+brl(m.total)+'</td><td style="text-align:center">'+m.qtd+'</td><td>'+brl(m.qtd?m.total/m.qtd:0)+'</td></tr>';}).join('')+
      '</tbody></table></div></div>';
    setTimeout(function(){
      var el=g('ch-m'); if(!el)return;
      try{ CHARTS.m=criarGraficoComFonte(el,{type:'line',data:{labels:(d.porMes||[]).map(function(m){return m.mes;}),datasets:[{data:(d.porMes||[]).map(function(m){return m.total;}),borderColor:'#1A73E8',backgroundColor:'rgba(26,115,232,.1)',tension:.35,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return brl(ctx.parsed.y);}}}},scales:{y:{ticks:{callback:function(v){return brl(v);}}}}}}); }catch(e){ console.warn('Gráfico falhou ao renderizar:', e); }
    },60);
  } else if(tab==='ano'){
    g('st-body').innerHTML='<div class="card"><div class="card-hd">Detalhe por ano</div><table><thead><tr><th>Ano</th><th>Total</th><th>Notas</th><th>Descontos</th><th>Ticket</th></tr></thead><tbody>'+
      (d.porAno||[]).map(function(a){return '<tr><td style="font-weight:700;font-size:15px">'+a.ano+'</td><td style="font-weight:600">'+brl(a.total)+'</td><td style="text-align:center">'+a.qtd+'</td><td style="color:#34A853">'+brl(a.desconto)+'</td><td>'+brl(a.qtd?a.total/a.qtd:0)+'</td></tr>';}).join('')+
      '</tbody></table></div>';
  } else {
    var tot=(d.pagamentos||[]).reduce(function(s,p){return s+p.qtd;},0);
    g('st-body').innerHTML='<div class="g2"><div class="ch ch-h" style="height:280px"><h4>Formas de pagamento</h4><canvas id="ch-p"></canvas></div>'+
      '<div class="card"><div class="card-hd">Detalhe por forma de pagamento</div><table><thead><tr><th>Forma</th><th>Notas</th><th>Total</th><th>%</th></tr></thead><tbody>'+
      (d.pagamentos||[]).map(function(p){return '<tr><td>'+tagPagto(p.forma)+'</td><td style="text-align:center">'+p.qtd+'</td><td style="font-weight:600">'+brl(p.total)+'</td><td style="color:#1A73E8;font-weight:600">'+(tot?((p.qtd/tot)*100).toFixed(1):0)+'%</td></tr>';}).join('')+
      '</tbody></table></div></div>';
    setTimeout(function(){
      var el=g('ch-p'); if(!el)return;
      try{ CHARTS.p=criarGraficoComFonte(el,{type:'doughnut',data:{labels:(d.pagamentos||[]).map(function(p){return p.forma;}),datasets:[{data:(d.pagamentos||[]).map(function(p){return p.qtd;}),backgroundColor:['#1A73E8','#34A853','#FBBC04','#EA4335','#9C27B0'],borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}}); }catch(e){ console.warn('Gráfico falhou ao renderizar:', e); }
    },60);
  }
}
