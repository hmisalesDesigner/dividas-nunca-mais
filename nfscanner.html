// COMPARATIVOS
// ══════════════════════════════════════════════════════════════════
async function pgComp(){
  try{
    var {data:notas,error} = await sb.from('notas_fiscais').select('*');
    if(error) throw error;
    if(!notas||!notas.length){ setPage('<div class="empty"><div class="empty-i">📉</div><p>Nenhuma nota.</p></div>'); return; }
    var {data:estabsAll} = await sb.from('estabelecimentos').select('*');
    estabsAll=estabsAll||[];
    var estabNomeMap={};
    estabsAll.forEach(function(e){ if(e.cnpj) estabNomeMap[e.cnpj]=(String(e.nome_fantasia||'').trim())||String(e.razao_social||'')||e.cnpj; });

    var por={};
    notas.forEach(function(n){
      var k=estabNomeMap[n.cnpj]||String(n.estabelecimento||'');
      if(!por[k])por[k]={l:k,d:{},tot:0};
      var m=mesStr(n.data_emissao);
      por[k].d[m]=(por[k].d[m]||0)+(Number(n.valor_total)||0);
      por[k].tot+=Number(n.valor_total)||0;
    });
    var meses=[...new Set(notas.map(function(n){return mesStr(n.data_emissao);}))].sort(cmpMes).slice(-10);
    var estabs=Object.values(por).sort(function(a,b){return b.tot-a.tot;}).slice(0,5);
    var tots=estabs.map(function(e){return e.tot;});
    var totalAll=tots.reduce(function(a,b){return a+b;},0);
    setPage(
      '<div class="ch ch-h" style="height:320px;margin-bottom:12px"><h4>📈 Gasto mensal por estabelecimento</h4><canvas id="ch-co"></canvas></div>'+
      '<div class="g2">'+
      '<div class="ch ch-h" style="height:320px"><h4>🥧 Participação total</h4><canvas id="ch-pi"></canvas></div>'+
      '<div class="card"><div class="card-hd">Resumo</div><table><thead><tr><th>Estabelecimento</th><th>Total</th><th>%</th></tr></thead><tbody>'+
      estabs.map(function(e,i){return '<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+CORES[i]+';margin-right:6px"></span><strong>'+esc(e.l)+'</strong></td><td style="font-weight:600">'+brl(e.tot)+'</td><td style="color:#1A73E8;font-weight:600">'+(totalAll?(e.tot/totalAll*100).toFixed(1):0)+'%</td></tr>';}).join('')+
      '<tr style="border-top:2px solid var(--border-c)"><td style="font-weight:700">Total</td><td style="font-weight:700">'+brl(totalAll)+'</td><td style="color:var(--text-2)">100%</td></tr>'+
      '</tbody></table></div></div>'
    );
    setTimeout(function(){
      var el=g('ch-co'); if(!el)return;
      try{ CHARTS.co=criarGraficoComFonte(el,{type:'bar',data:{labels:meses,datasets:estabs.map(function(e,i){return{label:e.l,data:meses.map(function(m){return e.d[m]||0;}),backgroundColor:CORES[i]+'88',borderColor:CORES[i],borderWidth:1.5,borderRadius:4};})},options:{responsive:true,maintainAspectRatio:false,layout:{padding:{left:8,right:14,top:8,bottom:4}},plugins:{legend:{position:'bottom',labels:{font:{size:12},boxWidth:14,padding:16}},tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+': '+brl(ctx.parsed.y);}}}},scales:{y:{ticks:{font:{size:14},maxTicksLimit:6,callback:function(v){return brl(v);}}},x:{ticks:{font:{size:12.5}}}}}}); }catch(e){ console.warn('Gráfico falhou ao renderizar:', e); }
      var el2=g('ch-pi'); if(!el2)return;
      try{ CHARTS.pi=criarGraficoComFonte(el2,{type:'doughnut',data:{labels:estabs.map(function(e){return e.l;}),datasets:[{data:tots,backgroundColor:CORES,borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,maintainAspectRatio:false,cutout:'45%',plugins:{legend:{position:'right',labels:{font:{size:14}}},tooltip:{callbacks:{label:function(ctx){return ctx.label+': '+brl(ctx.raw)+' ('+(totalAll?(ctx.raw/totalAll*100).toFixed(1):0)+'%)';}}}}}}); }catch(e){ console.warn('Gráfico falhou ao renderizar:', e); }
    },80);
  }catch(e){ err(e); }
}

// ══════════════════════════════════════════════════════════════════
// SUPERMERCADOS
// ══════════════════════════════════════════════════════════════════
async function pgSup(){
  try{
    var {data:notas} = await sb.from('notas_fiscais').select('*');
    var {data:estabs} = await sb.from('estabelecimentos').select('*');
    var {data:itens} = await sb.from('itens').select('*');
    notas=notas||[]; estabs=estabs||[]; itens=itens||[];
    if(!notas.length){ setPage('<div class="empty"><div class="empty-i">🏪</div><p>Nenhum dado.</p></div>'); return; }

    var estabNome={};
    estabs.forEach(function(e){ if(e.cnpj) estabNome[e.cnpj]=(String(e.nome_fantasia||'').trim())||String(e.razao_social||'')||e.cnpj; });
    var notaMap={};
    notas.forEach(function(n){ notaMap[n.id]={cnpj:n.cnpj,estab:n.estabelecimento}; });
    var por={};
    notas.forEach(function(n){
      var nome=estabNome[n.cnpj]||String(n.estabelecimento||'');
      if(!por[nome])por[nome]={nome:nome,total:0,qtd:0,itens:0};
      por[nome].total+=Number(n.valor_total)||0; por[nome].qtd++;
    });
    itens.forEach(function(it){
      var meta=notaMap[it.nota_id]; if(!meta)return;
      var nome=estabNome[meta.cnpj]||String(meta.estab||'');
      if(por[nome])por[nome].itens+=Number(it.quantidade)||1;
    });
    var data=Object.values(por).map(function(e){return{...e,ticket:e.qtd?e.total/e.qtd:0};}).sort(function(a,b){return b.total-a.total;});

    var alturaChart = Math.max(260, data.length * 62 + 80);
    setPage(
      '<div class="g2" style="margin-bottom:12px">'+
      '<div class="ch ch-h" style="height:'+alturaChart+'px"><h4>💰 Total gasto</h4><canvas id="ch-st"></canvas></div>'+
      '<div class="ch ch-h" style="height:'+alturaChart+'px"><h4>🎫 Ticket médio</h4><canvas id="ch-sk"></canvas></div>'+
      '</div>'+
      '<div class="card"><div class="card-hd">Detalhe por estabelecimento</div><table><thead><tr><th>Estabelecimento</th><th>Nº Notas</th><th>Total</th><th>Ticket Médio</th><th>Itens</th></tr></thead><tbody>'+
      data.map(function(e,i){return '<tr><td><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:'+CORES[i%CORES.length]+';margin-right:7px"></span><strong>'+esc(e.nome)+'</strong></td><td style="text-align:center">'+e.qtd+'</td><td style="font-weight:700">'+brl(e.total)+'</td><td>'+brl(e.ticket)+'</td><td style="text-align:center">'+Math.round(e.itens)+'</td></tr>';}).join('')+
      '</tbody></table></div>'
    );
    setTimeout(function(){
      var el=g('ch-st'); if(!el)return;
      try{ CHARTS.st=criarGraficoComFonte(el,{type:'bar',data:{labels:data.map(function(e){return e.nome;}),datasets:[{data:data.map(function(e){return e.total;}),backgroundColor:CORES.map(function(c){return c+'99';}),borderColor:CORES,borderWidth:1.5,borderRadius:6,barPercentage:0.6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:16,top:6,bottom:4}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return brl(ctx.parsed.x);}}}},scales:{x:{ticks:{font:{size:12},maxTicksLimit:5,callback:function(v){return brl(v);}}},y:{ticks:{font:{size:14}}}}}}); }catch(e){ console.warn('Gráfico falhou ao renderizar:', e); }
      var el2=g('ch-sk'); if(!el2)return;
      try{ CHARTS.sk=criarGraficoComFonte(el2,{type:'bar',data:{labels:data.map(function(e){return e.nome;}),datasets:[{data:data.map(function(e){return e.ticket;}),backgroundColor:'rgba(52,168,83,.6)',borderColor:'#34A853',borderWidth:1.5,borderRadius:6,barPercentage:0.6}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,layout:{padding:{right:16,top:6,bottom:4}},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return brl(ctx.parsed.x);}}}},scales:{x:{ticks:{font:{size:12},maxTicksLimit:5,callback:function(v){return brl(v);}}},y:{ticks:{font:{size:14}}}}}}); }catch(e){ console.warn('Gráfico falhou ao renderizar:', e); }
    },80);
  }catch(e){ err(e); }
}

// ══════════════════════════════════════════════════════════════════
// ESTOQUE
// ══════════════════════════════════════════════════════════════════
var _est=[];
var _estF={q:'',c:'',s:'disponivel',l:'',g:'local'};
function estTitulo(s){ return String(s||'').toLowerCase().replace(/(^|\s)(\S)/g,function(m,a,b){return a+b.toUpperCase();}); }
function estQtd(q){ return String(Math.round((Number(q)||0)*100)/100).replace('.',','); }
async function pgEst(){
  setActs('<button class="btn bp bsm" onclick="formEst(null)">+ Adicionar</button> <button class="btn bg bsm" onclick="pgEst()">↺</button>');
  try{
    var r=await sb.from('estoque').select('*').order('id',{ascending:false});
    if(r.error) throw r.error;
    _est=r.data||[];
    var opt=function(a,sel){return a.map(function(o){return '<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+o[1]+'</option>';}).join('');};
    var locais=Array.from(new Set(_est.map(function(i){return i.local||'';}).filter(Boolean))).sort();
    setPage('<div id="est-kpis" class="kpis" style="margin-bottom:12px"></div>'+
      '<div class="tbar">'+
      '<input type="text" id="q-est" placeholder="🔍 Buscar produto ou marca..." value="'+esc(_estF.q)+'" oninput="filtEst()" style="width:240px">'+
      '<select id="c-est" onchange="filtEst()"><option value="">Todas categorias</option>'+CATS.map(function(c){return '<option'+(c===_estF.c?' selected':'')+'>'+c+'</option>';}).join('')+'</select>'+
      '<select id="l-est" onchange="filtEst()"><option value="">Todos os locais</option>'+opt(locais.map(function(l){return [l,l];}),_estF.l)+'</select>'+
      '<select id="s-est" onchange="filtEst()">'+opt([['','Todos'],['disponivel','Disponíveis'],['acabou','Acabaram']],_estF.s)+'</select>'+
      '<select id="g-est" onchange="filtEst()">'+opt([['local','Agrupar por local'],['categoria','Agrupar por categoria'],['nenhum','Sem agrupar']],_estF.g)+'</select>'+
      '</div><div id="est-cards"></div>'+
      '<p style="font-size:11px;color:var(--text-2);margin-top:8px">👆 Clique em um item para informar a quantidade que você tem. Quando a quantidade chega a 0, ele passa para "Acabaram".</p>');
    window.filtEst=function(){ _estF.q=v('q-est'); _estF.c=v('c-est'); _estF.l=v('l-est'); _estF.s=v('s-est'); _estF.g=v('g-est'); rEstCards(); };
    rEstCards();
  }catch(e){ err(e); }
}
function rEstCards(){
  var hoje=new Date(), q=(_estF.q||'').toLowerCase();
  var diasDe=function(it){ var val=it.validade?new Date(String(it.validade).substring(0,10)):null; return val&&!isNaN(val)?Math.ceil((val-hoje)/86400000):null; };
  var lista=_est.filter(function(i){
    return (!q||String(i.descricao||'').toLowerCase().includes(q)||String(i.marca||'').toLowerCase().includes(q))&&(!_estF.c||i.categoria===_estF.c)&&(!_estF.l||i.local===_estF.l)&&(!_estF.s||(i.status||'disponivel')===_estF.s);
  });
  var disp=_est.filter(function(i){return (i.status||'disponivel')==='disponivel';});

          '<span style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1" title="'+esc(m.nome||'')+'">'+esc(m.nome||'')+'</span>'+
          '<button onclick="delMarc('+m.id+')" style="flex-shrink:0;background:none;border:none;cursor:pointer;color:#EA4335;font-size:15px;padding:0 2px">🗑️</button>'+
          '</div>';
      }).join('');
    }
    setPage('<div class="tbar"><input type="text" id="q-marc" placeholder="🔍 Filtrar..." oninput="filtMarc()" style="width:240px"><span id="cnt-marc" style="color:var(--text-2);font-size:12px">'+(data||[]).length+' marcas</span></div><div id="gd-marc" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px"></div>');
    rM(data||[]);
    window.filtMarc=function(){var q=(v('q-marc')||'').toLowerCase();rM(_marcs.filter(function(m){return String(m.nome||'').toLowerCase().includes(q);}));};
  }catch(e){ err(e); }
}
function formMarc(){
  openMo('🏷️ Nova Marca',
    '<div class="fg"><label>Nome *</label><input id="mn" placeholder="Ex: NESTLÉ"></div>'+
    '<div class="fg"><label>Categoria</label><select id="mc"><option value="">Qualquer</option>'+CATS.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>',
    '<button class="btn bg" onclick="closeMo()">Cancelar</button><button class="btn bs" onclick="salvMarc()">💾 Salvar</button>'
  );
}
async function salvMarc(){
  var nome=v('mn').toUpperCase().trim();
  if(!nome){alert('Digite o nome');return;}
  closeMo();
  var {error} = await sb.from('marcas').insert({nome:nome, categoria:v('mc')});
  if(error && error.code==='23505') alert('Marca já existe!');
  pgMarcas();
}
async function delMarc(id){ if(!confirm('Excluir?'))return; await sb.from('marcas').delete().eq('id',id); pgMarcas(); }

// ══════════════════════════════════════════════════════════════════
// BACKUP
// ══════════════════════════════════════════════════════════════════
function pgBack(){
  setPage(
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:800px">'+
    '<div class="card" style="padding:24px"><div style="font-size:44px;margin-bottom:12px">💾</div><h3 style="font-size:15px;margin-bottom:8px">Exportar Backup</h3><p style="color:var(--text-2);font-size:12px;line-height:1.6;margin-bottom:18px">Exporta todos os dados do Supabase para um arquivo JSON.</p><button class="btn bp" onclick="expBkp()">📥 Baixar backup JSON</button><div id="bkp-st" style="margin-top:10px"></div></div>'+
    '<div class="card" style="padding:24px"><div style="font-size:44px;margin-bottom:12px">📤</div><h3 style="font-size:15px;margin-bottom:8px">Importar Backup</h3><p style="color:var(--text-2);font-size:12px;line-height:1.6;margin-bottom:18px">Restaura dados de um backup JSON (SQLite convertido ou Supabase).</p><input type="file" id="bf" accept=".json" style="display:none" onchange="impBkp(this.files[0])"><button class="btn bg" onclick="g(\'bf\').click()">📂 Selecionar JSON</button><div id="imp-bkp-st" style="margin-top:10px"></div></div>'+
    '</div>'
  );
}
async function exportarBackupArquivo(){
  var tabelas=['notas_fiscais','itens','estabelecimentos','estoque','devolucoes','marcas','lista_compras','produtos'];
  var out={};
  for(var i=0;i<tabelas.length;i++){
    var {data} = await sb.from(tabelas[i]).select('*');
    out[tabelas[i]]=data||[];
  }
  var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='NFScanner_backup_'+new Date().toISOString().substring(0,10)+'.json';
  a.click();
}
async function expBkp(){
  g('bkp-st').innerHTML='<div class="alert ai">⏳ Exportando...</div>';
  try{
    await exportarBackupArquivo();
    g('bkp-st').innerHTML='<div class="alert as">✅ Exportado!</div>';
    resetLembreteBackup();
  }catch(e){ g('bkp-st').innerHTML='<div class="alert ae">'+esc(e.message)+'</div>'; }
}
function impBkp(f){
  if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      var itensPrep=(data.itens||[]).map(function(it){
        var desc=(it.descricao||'').trim();
        var match=matchProduto(desc);
        var copia=Object.assign({}, it);
        copia.descricaoOriginal=desc;
        copia.descricaoSugerida=match?match.nome:null;
        copia.descricao=match?match.nome:sugerirNomeLimpo(desc);
        copia.confirmado=false;
        return copia;
      });
      _bkpRevisao={raw:data, itens:itensPrep};
      renderBkpRevisao();
    }catch(ex){ alert('Arquivo inválido: '+ex.message); }
  };
  r.readAsText(f);
}
function renderBkpRevisao(){
  var itens=_bkpRevisao.itens;
  var prog=progressoConfirmacao(itens);
  var notaMap={};
  (_bkpRevisao.raw.notas_fiscais||[]).forEach(function(n){ notaMap[n.id]={estab:n.estabelecimento, data:n.data_emissao}; });
  var rows=itens.map(function(it,i){
    var ctxInfo=notaMap[it.nota_id]||{};
    return '<tr id="prod-row-bkp-'+i+'">'+
      '<td style="color:var(--text-2)">'+(i+1)+'</td>'+
      '<td>'+produtoCellHtml(it,i,'bkp')+'</td>'+
      '<td style="font-size:11px;color:var(--text-2)">'+esc(ctxInfo.estab||'—')+'</td>'+
      '<td style="font-size:11px;color:var(--text-2)">'+fmt(ctxInfo.data)+'</td>'+
      '<td style="text-align:right;font-size:11px;font-weight:600">'+brl(it.valor_total)+'</td>'+
    '</tr>';
  }).join('');
  var podeImportar=prog.feitos===prog.total;
  setPage(
    '<div class="card">'+
    '<div class="card-hd" style="flex-wrap:wrap;gap:10px">'+
    '<div>📤 Revisar itens do backup <span style="font-weight:400;color:var(--text-2);font-size:11px">— '+prog.feitos+' de '+prog.total+' produtos confirmados</span></div>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn bg bsm" onclick="confirmarSugestoesRestantes(\'bkp\')">✅ Confirmar sugestões</button>'+
    '<button class="btn bg bsm" onclick="aceitarTodosNovos(\'bkp\')">☑️ Aceitar restantes como estão</button>'+
    '<button class="btn bs" '+(podeImportar?'':'disabled style="opacity:.5;cursor:not-allowed"')+' onclick="finalizarImportBkp()">💾 Importar tudo</button>'+
    '<button class="btn bd bsm" onclick="cancelarImportBkp()">Cancelar</button>'+
    '</div></div>'+
    '<div style="height:5px;background:var(--border-c);border-radius:3px;margin:0 16px 10px;overflow:hidden"><div style="height:100%;width:'+prog.pct+'%;background:'+(podeImportar?'#34A853':'#1A73E8')+';transition:width .2s"></div></div>'+
    '<p style="padding:0 16px 10px;font-size:11px;color:var(--text-2)">São '+itens.length+' itens de '+(_bkpRevisao.raw.notas_fiscais||[]).length+' notas. Use "Confirmar sugestões" para aceitar automaticamente os produtos já reconhecidos, e revise manualmente os marcados como "Novo produto".</p>'+
    '<div style="overflow-x:auto;max-height:520px;overflow-y:auto"><table><thead><tr><th>#</th><th>Produto</th><th>Estabelecimento</th><th>Data</th><th>Valor</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'
  );
}
function cancelarImportBkp(){ _bkpRevisao=null; pgBack(); }
async function finalizarImportBkp(){
  var data=_bkpRevisao.raw;
  var itensRevisados=_bkpRevisao.itens;
  try{
    var idMapNotas={};
    if(data.notas_fiscais && data.notas_fiscais.length){
      for(var i=0;i<data.notas_fiscais.length;i++){
        var n=data.notas_fiscais[i];
        var oldId=n.id;
        var {data:ins,error} = await sb.from('notas_fiscais').insert({
          chave_acesso:n.chave_acesso, data_emissao:n.data_emissao, estabelecimento:n.estabelecimento,
          cnpj:n.cnpj, valor_total:n.valor_total, desconto_total:n.desconto_total,
          tributos_total:n.tributos_total, tributos_sefaz:n.tributos_sefaz||0,
          tributos_impressos:n.tributos_impressos||n.tributos_total||0,
          forma_pagamento:n.forma_pagamento
        }).select().single();
        if(!error && ins) idMapNotas[oldId]=ins.id;
      }
    }
    if(itensRevisados.length){
      var itensIns=itensRevisados.map(function(it){ return {
        nota_id: idMapNotas[it.nota_id]||null, descricao:it.descricao, marca:it.marca,
        quantidade:it.quantidade, unidade:it.unidade, peso_kg:it.peso_kg||0,
        valor_kg:it.valor_kg||0, valor_unitario:it.valor_unitario, valor_total:it.valor_total,
        categoria:it.categoria, local:it.local
      };}).filter(function(it){return it.nota_id;});
      if(itensIns.length) await sb.from('itens').insert(itensIns);
      await syncProdutosFromItens(itensRevisados);
    }
    if(data.estabelecimentos && data.estabelecimentos.length){
      var estIns=data.estabelecimentos.map(function(e){ var c=Object.assign({},e); delete c.id; return c; });
      await sb.from('estabelecimentos').insert(estIns);
    }
    if(data.estoque && data.estoque.length){
      var estoIns=data.estoque.map(function(it){ var c=Object.assign({},it); delete c.id; return c; });
      await sb.from('estoque').insert(estoIns);
    }
    if(data.marcas && data.marcas.length){
      var marcIns=data.marcas.map(function(m){ return {nome:m.nome,categoria:m.categoria||''}; });
      await sb.from('marcas').upsert(marcIns, {onConflict:'nome',ignoreDuplicates:true});
    }
    if(data.lista_compras && data.lista_compras.length){
      var listaIns=data.lista_compras.map(function(l){ var c=Object.assign({},l); delete c.id; return c; });
      await sb.from('lista_compras').insert(listaIns);
    }
    if(data.devolucoes && data.devolucoes.length){
      var devIns=data.devolucoes.map(function(dv){ var c=Object.assign({},dv); delete c.id; return c; });
      await sb.from('devolucoes').insert(devIns);
    }
    _bkpRevisao=null;
    setPage('<div style="max-width:480px;text-align:center;padding:40px"><div style="font-size:56px;margin-bottom:14px">✅</div><h3>Backup importado!</h3><p style="color:var(--text-2);margin:12px 0">Todos os produtos foram revisados e salvos.</p><button class="btn bp" onclick="go(\'dashboard\')">📊 Ver Dashboard</button></div>');
  }catch(ex){ alert('Erro ao importar: '+ex.message); }
}

// ── Lembrete periódico de backup ────────────────────────────────────
var LEMBRETE_BACKUP_MS = 30*60*1000;
var _lembreteBackupTimer = null;
function iniciarLembreteBackup(){
  if(_lembreteBackupTimer) clearInterval(_lembreteBackupTimer);
  _lembreteBackupTimer = setInterval(mostrarLembreteBackup, LEMBRETE_BACKUP_MS);
}
function resetLembreteBackup(){ iniciarLembreteBackup(); }
function mostrarLembreteBackup(){
  if(document.getElementById('backup-toast')) return;
  var div=document.createElement('div');
  div.id='backup-toast'; div.className='backup-toast';
  div.innerHTML =
    '<div style="display:flex;gap:10px;align-items:flex-start">'+
    '<div style="font-size:20px">💾</div>'+
    '<div style="flex:1">'+
    '<div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--text-1)">Hora do backup!</div>'+
    '<div style="font-size:12px;color:var(--text-2);margin-bottom:10px">Já se passaram 30 minutos. Exporte uma cópia de segurança do seu histórico.</div>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn bp bsm" onclick="exportarBackupArquivo();fecharLembreteBackup();resetLembreteBackup()">💾 Exportar agora</button>'+
    '<button class="btn bg bsm" onclick="fecharLembreteBackup()">Depois</button>'+
    '</div></div>'+
    '<button onclick="fecharLembreteBackup()" style="background:none;border:none;cursor:pointer;color:var(--text-2);font-size:16px;line-height:1">✕</button>'+
    '</div>';
  document.body.appendChild(div);
}
function fecharLembreteBackup(){ var el=document.getElementById('backup-toast'); if(el) el.remove(); }

async function iniciar(){
  if(!DB.marcas.length && MARCAS_SEED.length){
    // primeira vez neste Drive: semeia marcas padrão
    DB.marcas = MARCAS_SEED.map(function(m,i){ return {id:i+1, nome:m.nome, categoria:m.categoria}; });
    recalcSeq();
    scheduleDriveSave();
  }
  loadFontPrefs();
  ensureProdutosCatalog();
  MARCAS = DB.marcas.map(function(m){return m.nome;}).sort();
  var hoje=new Date();
  var urg=(DB.devolucoes||[]).filter(function(d){return d.status==='Pendente'&&d.data_limite&&Math.ceil((new Date(String(d.data_limite))-hoje)/86400000)<=5;}).length;
  if(urg>0){ var nb=g('nb-dev'); if(nb&&!nb.querySelector('.badge')) nb.innerHTML+='<span class="badge">'+urg+'</span>'; }
  iniciarLembreteBackup();
  go('dashboard');
}
document.addEventListener('DOMContentLoaded', function(){
  applyTheme(localStorage.getItem('nfscanner_theme')||'light');
  (function tentarIniciarGoogle(tentativas){
    if(typeof google!=='undefined' && google.accounts && google.accounts.oauth2){
      initGoogleAuth();
    } else if(tentativas>0){
      setTimeout(function(){ tentarIniciarGoogle(tentativas-1); }, 300);
    } else {
      var pageEl=document.getElementById('page');
      if(pageEl) pageEl.innerHTML='<div class="alert ae" style="margin:20px">Não foi possível carregar o login do Google. Verifique sua conexão com a internet ou desative temporariamente algum bloqueador de anúncios/extensão, depois recarregue a página (Ctrl+Shift+R).</div>';
    }
  })(40);
});
